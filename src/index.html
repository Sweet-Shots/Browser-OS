<!DOCTYPE html>
<!--
=====================================================================
 MyOS: a portable, single-file web desktop
=====================================================================

 Double-click this file to open it in any modern browser (Chrome,
 Edge, Firefox, Safari). It needs no install, no internet and no
 special permissions. Everything (the OS, the apps and ALL of your
 files and settings) lives inside this one .html file.

 HOW SAVING WORKS
 * Chrome / Edge: the first time you save (Ctrl+S / Cmd+S, or the
   save button in the taskbar), a "Save as" dialog opens. Pick THIS
   file (myos.html) to overwrite it. For the rest of the session every
   save silently overwrites that same file with one keystroke. After
   you close the tab and reopen the file, the first save asks again.
 * Firefox / Safari, or Chrome/Edge with the File System Access API
   blocked by policy: each save downloads a complete new copy named
   myos.html (your browser may call it "myos (1).html"). Replace your
   old file with the new one, for example by copying it back onto your
   USB stick. The old file is never changed.
 * A dot on the save button means there are unsaved changes. The
   browser warns you if you try to close the tab with unsaved changes.

 CRASH RECOVERY BACKUP
 While you have unsaved changes, a backup is written to this browser's
 local storage every 30 seconds. If the tab crashes, reopen the same
 file on the SAME computer and browser and you will be offered the
 backup. The backup never leaves that computer, it is not part of the
 .html file, and if you use a password the backup is encrypted too.
 On a shared or school computer, a backup can stay behind in that
 browser profile. Use a password if that matters to you.

 PASSWORD
 You can set an optional password on first launch or later in
 Settings. With a password, all data inside the file is encrypted with
 AES-GCM using a key derived from your password (PBKDF2-SHA-256,
 600,000 iterations). Nothing readable is stored in the file.
 THERE IS NO PASSWORD RECOVERY. If you forget it, your data is gone.
 "Lock now" in the start menu drops the decrypted data from memory and
 returns to the lock screen.

 ADDING AN APP (for developers)
 Apps register through one call: OS.registerApp({ id, name, icon,
 fileTypes, defaultSize, singleInstance, launch(win, args) { ... } }).
 See the commented example app at the very end of the script, and the
 source tree (src/apps/*.js, built with "node build.js").

 KNOWN LIMITATIONS
 * The file grows with your data. Imported binary files are stored as
   base64, which is about 33% larger than the original. Very large
   files (hundreds of MB) will be slow to open and save.
 * Browser-reserved shortcuts (Ctrl+W, Ctrl+T, Ctrl+N, Ctrl+Tab...)
   belong to the browser and are not intercepted.
 * In Firefox/Safari every save creates a new download you must move
   into place yourself.
 * JavaScript cannot securely wipe memory. "Lock now" drops every
   reference to your decrypted data, and the browser frees it later.
 * Drag-and-drop between folders needs a mouse; on touch screens use
   the Move button instead.
=====================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8" data-keep>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-keep>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'" data-keep>
<title data-keep>MyOS</title>
<style data-keep>
/*@@CSS@@*/
</style>
</head>
<body>
<div id="os-root" data-keep></div>
<noscript data-keep><p style="font:16px sans-serif;padding:2em">MyOS needs JavaScript to run.</p></noscript>
<script type="application/json" id="os-data" data-keep>null</script>
<script data-keep>
/*@@JS@@*/
</script>
</body>
</html>
