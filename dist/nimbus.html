=====================================================================
 NIMBUS: a portable, single-file web desktop
=====================================================================

 Double-click this file to open it in Chrome, Edge, Firefox or Safari.
 No install, no internet and no special permissions are needed.
 The whole system (apps, settings and ALL of your files) lives inside
 this one .html file. Carry it on a USB stick or a cloud drive.

 HOW SAVING WORKS
 * Chrome / Edge: the first time you save (Ctrl+S / Cmd+S, or the save
   button on the shelf), a "Save as" dialog opens. Pick THIS file
   (nimbus.html) to overwrite it. For the rest of the session every
   save overwrites that same file instantly. After you reopen the file,
   the first save asks again.
 * Firefox / Safari, or Chrome/Edge with direct file access blocked by
   policy: each save downloads a complete new copy named nimbus.html
   (your browser may call it "nimbus (1).html"). Replace your old file
   with the new one. The old file is never changed.
 * A dot on the save button means there are unsaved changes, and the
   browser warns you before you close the tab with unsaved changes.

 CRASH RECOVERY BACKUP
 While you have unsaved changes, a backup is written to this browser's
 local storage every 30 seconds. If the tab crashes, reopen the same
 file on the SAME computer and browser and you will be offered the
 backup. It never leaves that computer and is not part of the file.
 With a password set, the backup is encrypted too. On a shared
 computer you can remove it in Settings > Storage.

 PASSWORD
 Optional, set during setup or later in Settings. With a password, all
 data in the file is encrypted with AES-GCM using a key derived from
 your password (PBKDF2-SHA-256, 600,000 iterations); nothing readable
 is stored. THERE IS NO PASSWORD RECOVERY: forget it and the data is
 gone. "Lock now" (quick settings or Settings) drops the decrypted data
 from memory and shows the lock screen.

 THE BROWSER APP
 Nimbus itself never uses the network. The Browser app goes online only
 when you visit a site. Many big sites (Google, YouTube, school
 portals) refuse to be shown inside another page; use "Open in new
 tab" for those. Your own HTML files open in a locked-down sandbox.

 USING IT AS YOUR EVERYDAY DESKTOP (e.g. on an old laptop)
 Open it full screen (quick settings > Full screen), or start Chrome
 in app mode for a borderless window (Settings > About shows the exact
 command). Keyboard: Ctrl+K opens the launcher. Drag windows to a
 screen edge to snap them. Right-click almost anything for options.

 ADDING AN APP
 Developers: an app is one OS.registerApp({ id, name, icon, launch(win,
 args) {...} }) call. Either add a file to src/apps/ and run
 "node build.js", or install a .js file at runtime from the Store
 ("Install from file"; the Store can download an example). See the
 commented example at the end of the script.

 KNOWN LIMITATIONS
 * The file grows with your data. Imported pictures and other binary
   files are stored as base64 (about 33% larger than the original).
   Very large files (hundreds of MB) are slow to open and save.
 * Browser-reserved shortcuts (Ctrl+W, Ctrl+T, Ctrl+N, Ctrl+Tab,
   F11...) belong to the browser and are not intercepted.
 * In Firefox/Safari every save creates a new download you must move
   into place yourself.
 * Sounds may stay silent until your first click (browsers block audio
   before any interaction). Alarms ring only while Nimbus is open.
 * JavaScript cannot securely wipe memory. "Lock now" drops every
   reference to your decrypted data; the browser frees it later.
 * Drag-and-drop between folders needs a mouse; on touch screens use
   "Move to" or Copy/Cut/Paste.

 Font: Figtree (SIL Open Font License 1.1). Everything else was made
 for Nimbus.

  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
  --shelf-h: 64px;
  --ease: cubic-bezier(.2, 0, 0, 1);
  --ease-out: cubic-bezier(.05, .7, .1, 1);

  /* defaults (light) until OS.theme.apply() runs */
  --primary: #4d5bb5; --on-primary: #fff; --primary-container: #dfe0ff; --on-primary-container: #2a3474;
  --secondary-container: #e1e2ec; --on-secondary-container: #2c2f3a;
  --tertiary-container: #f3dcf3; --on-tertiary-container: #4a2a4a;
  --surface: #fbfaff; --surface-low: #f4f3fa; --surface-container: #efeef5; --surface-high: #e9e8ef; --surface-highest: #e3e2e9;
  --on-surface: #1b1c22; --on-surface-variant: #464752; --outline: #777884; --outline-variant: #c7c6d2;
  --error: #ba1a1a; --on-error: #fff; --error-container: #ffdad6; --on-error-container: #410002;
  --success: #1e7f4f; --warn: #8a5a00;
  --hover: rgba(27, 28, 34, .08); --pressed: rgba(27, 28, 34, .12); --selected: rgba(77, 91, 181, .14); --focus-ring: rgba(77, 91, 181, .45);
  --scrim: rgba(10, 14, 24, .32); --glass: rgba(239, 238, 245, .8); --glass-strong: rgba(244, 243, 250, .9);
  --shadow-1: 0 1px 2px rgba(20, 25, 40, .08), 0 1px 3px rgba(20, 25, 40, .06);
  --shadow-2: 0 4px 14px rgba(20, 25, 40, .10), 0 1px 3px rgba(20, 25, 40, .06);
  --shadow-3: 0 18px 44px rgba(20, 25, 40, .18), 0 3px 10px rgba(20, 25, 40, .08);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --primary: #bcc2ff; --on-primary: #1f2a6b; --primary-container: #353f86; --on-primary-container: #dfe0ff;
  --surface: #131318; --surface-low: #1b1b21; --surface-container: #1f1f25; --surface-high: #2a292f; --surface-highest: #34343a;
  --on-surface: #e4e1e9; --on-surface-variant: #c7c5d0; --outline: #91909b; --outline-variant: #46464f;
  --hover: rgba(228, 225, 233, .08); --pressed: rgba(228, 225, 233, .12);
  --scrim: rgba(0, 0, 0, .55); --glass: rgba(31, 31, 37, .78); --glass-strong: rgba(27, 27, 33, .9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  font-family: var(--font); font-size: 14px; line-height: 1.4; color: var(--on-surface);
  background: var(--surface-highest);
  -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01";
}
#os-root { position: fixed; inset: 0; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-tap-highlight-color: transparent; }
svg { display: block; }
[hidden] { display: none !important; }
::selection { background: var(--primary-container); color: var(--on-primary-container); }
a { color: var(--primary); }
.ico svg { width: 100%; height: 100%; }
.themed-icons .app-ico svg { --ic-bg: var(--primary-container); --ic-fg: var(--on-primary-container); }

/* ---- buttons (Material 3 style) ---- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 20px; border: 0; border-radius: var(--r-full);
  background: var(--surface-high); color: var(--on-surface); font-weight: 600; font-size: 14px;
  cursor: pointer; white-space: nowrap; user-select: none; -webkit-user-select: none;
  transition: background-color .15s var(--ease), box-shadow .15s var(--ease), transform .1s;
}
.btn:hover { background: var(--surface-highest); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover { box-shadow: var(--shadow-1); filter: brightness(1.06); }
.btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn.tonal:hover { filter: brightness(.97); }
:root[data-theme="dark"] .btn.tonal:hover { filter: brightness(1.12); }
.btn.text { background: transparent; color: var(--primary); padding: 0 14px; }
.btn.text:hover { background: var(--selected); }
.btn.outlined { background: transparent; border: 1px solid var(--outline); color: var(--primary); }
.btn.outlined:hover { background: var(--selected); }
.btn.danger { color: var(--error); }
.btn.danger-filled { background: var(--error); color: var(--on-error); }
.btn.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn:focus-visible, .icon-btn:focus-visible, .input:focus-visible, .seg-btn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 40px; height: 40px; padding: 0; border: 0; border-radius: var(--r-full);
  background: transparent; color: var(--on-surface-variant); cursor: pointer;
  transition: background-color .15s var(--ease);
}
.icon-btn:hover { background: var(--hover); color: var(--on-surface); }
.icon-btn:active { background: var(--pressed); }
.icon-btn.active { background: var(--secondary-container); color: var(--on-secondary-container); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn.sm svg { width: 18px; height: 18px; }

.input {
  min-height: 40px; padding: 8px 14px; width: 100%;
  border: 1px solid var(--outline-variant); border-radius: var(--r-sm);
  background: var(--surface); color: var(--on-surface); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input:hover { border-color: var(--outline); }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.input.big { min-height: 52px; font-size: 16px; padding: 12px 18px; border-radius: var(--r-md); }
.input::placeholder { color: var(--on-surface-variant); opacity: .75; }
select.input { appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

/* switch: <input type=checkbox class=switch> */
.switch { appearance: none; -webkit-appearance: none; position: relative; width: 52px; height: 32px; flex-shrink: 0; margin: 0;
  border-radius: var(--r-full); background: var(--surface-highest); border: 2px solid var(--outline); cursor: pointer; transition: background .2s, border-color .2s; }
.switch::after { content: ""; position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline);
  transform: translateY(-50%); transition: all .2s var(--ease); }
.switch:checked { background: var(--primary); border-color: var(--primary); }
.switch:checked::after { left: 24px; width: 24px; height: 24px; background: var(--on-primary); }
.switch:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

/* range */
.range, .qs-range { appearance: none; -webkit-appearance: none; width: 100%; height: 16px; background: transparent; cursor: pointer; margin: 0; }
.range::-webkit-slider-runnable-track, .qs-range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--secondary-container); }
.range::-webkit-slider-thumb, .qs-range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: var(--primary); border: 0; }
.range::-moz-range-track, .qs-range::-moz-range-track { height: 6px; border-radius: 3px; background: var(--secondary-container); }
.range::-moz-range-progress, .qs-range::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--primary); }
.range::-moz-range-thumb, .qs-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--primary); border: 0; }

/* segmented buttons */
.seg { display: inline-flex; border: 1px solid var(--outline); border-radius: var(--r-full); overflow: hidden; flex-wrap: wrap; }
.seg-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border: 0; border-right: 1px solid var(--outline);
  background: transparent; color: var(--on-surface); cursor: pointer; font-weight: 600; font-size: 13.5px; }
.seg-btn:last-child { border-right: 0; }
.seg-btn:hover { background: var(--hover); }
.seg-btn.on { background: var(--secondary-container); color: var(--on-secondary-container); }
.seg-btn svg { width: 18px; height: 18px; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: var(--r-xs);
  border: 1px solid var(--outline-variant); background: transparent; color: var(--on-surface-variant); cursor: pointer; font-weight: 600; font-size: 13px; }
.chip:hover { background: var(--hover); }
.chip.on { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }
.chip svg { width: 16px; height: 16px; }

.toolbar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 6px 10px; background: var(--surface); }
.toolbar .sep { width: 1px; height: 24px; background: var(--outline-variant); margin: 0 6px; }
.toolbar .grow { flex: 1; }
.muted { color: var(--on-surface-variant); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); }
.spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -4px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes fade { from { opacity: 0; } }

* { scrollbar-width: thin; scrollbar-color: var(--outline-variant) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---- src/styles/20-shell.css ---- */
/* =====================================================================
   SHELL: desktop, shelf, panels, windows, menus, dialogs, toasts,
   splash / lock / setup screens
   ===================================================================== */

/* ---- desktop ---- */
#desktop { position: absolute; inset: 0; background: var(--surface-highest); transition: background .4s; }
#glance { position: absolute; top: 28px; left: 32px; right: 32px; color: #fff; pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25); }
.glance-date { font-size: clamp(22px, 3vw, 34px); font-weight: 500; letter-spacing: -.01em; }
.glance-sub { font-size: 15px; opacity: .92; margin-top: 2px; }
.glance-chip { display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; padding: 4px 12px 4px 10px; border-radius: var(--r-full); background: rgba(0,0,0,.25); font-size: 13px; text-shadow: none; }
.glance-chip svg { width: 16px; height: 16px; }
#desktop.on-light #glance { color: #1b1d26; text-shadow: 0 0 18px rgba(255,255,255,.6); }
#desktop.on-light .glance-chip { background: rgba(255,255,255,.55); }
#desktop.on-light .desk-icon { color: #1b1d26; }
#desktop.on-light .desk-icon .lbl { text-shadow: 0 0 6px rgba(255,255,255,.9), 0 0 2px rgba(255,255,255,.9); }
#desktop.on-light .desk-icon:hover { background: rgba(255,255,255,.35); }
#desktop.on-light .desk-icon.selected, #desktop.on-light .desk-icon:focus-visible { background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
#desktop-icons {
  position: absolute; top: 118px; left: 16px; right: 16px; bottom: calc(var(--shelf-h) + 8px);
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 104px); grid-auto-columns: 96px;
  gap: 4px; align-content: start; justify-content: start; overflow: hidden;
}
.desk-icon {
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: 92px; height: 100px; padding: 10px 4px 6px;
  border: 0; border-radius: var(--r-md); background: none; color: #fff; cursor: default; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.desk-icon .ico { width: 52px; height: 52px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.25)); }
.desk-icon .file-ico { padding: 2px; }
.desk-icon .lbl { font-size: 12.5px; font-weight: 500; line-height: 1.25; text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.5);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.desk-icon:hover { background: rgba(255,255,255,.14); }
.desk-icon:focus { outline: none; }
.desk-icon.selected, .desk-icon:focus-visible { background: rgba(255,255,255,.26); box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
#desktop.drop-target::after {
  content: "Drop to import to Desktop"; position: absolute; inset: 16px 16px calc(var(--shelf-h) + 16px);
  border: 3px dashed rgba(255,255,255,.85); border-radius: var(--r-xl); display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 20px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.5); background: rgba(0,0,0,.18); pointer-events: none;
}

/* ---- shelf ---- */
#shelf {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--shelf-h); z-index: 100000;
  display: flex; align-items: center; gap: 8px; padding: 0 10px; pointer-events: none; user-select: none; -webkit-user-select: none;
}
#shelf > * { pointer-events: auto; }
.shelf-center { flex: 1; display: flex; justify-content: center; min-width: 0; pointer-events: none !important; }
.shelf-right { display: flex; align-items: center; gap: 6px; }
.shelf-pill, .shelf-round {
  height: 48px; border: 0; border-radius: var(--r-full); background: var(--glass); color: var(--on-surface);
  -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
  box-shadow: var(--shadow-2), inset 0 0 0 1px rgba(255,255,255,.06);
}
.shelf-round { width: 48px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; flex-shrink: 0; transition: background .15s; }
.shelf-round:hover { background: var(--glass-strong); }
.shelf-round svg { width: 22px; height: 22px; }
#launcher-btn svg { width: 20px; height: 20px; stroke-width: 2.4; }
#launcher-btn.open, #status.open { background: var(--primary-container); color: var(--on-primary-container); }
#save-btn .dot { position: absolute; top: 9px; right: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--surface-container); display: none; }
#save-btn.dirty .dot { display: block; animation: pop .25s var(--ease-out); }
#shelf-apps { display: flex; align-items: center; gap: 2px; padding: 0 6px; max-width: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; pointer-events: auto; }
#shelf-apps::-webkit-scrollbar { display: none; }
.shelf-app { position: relative; width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-full); background: transparent; cursor: pointer; transition: background .15s, transform .15s var(--ease); }
.shelf-app:hover { background: var(--hover); }
.shelf-app:active { transform: scale(.92); }
.shelf-app .ico { width: 34px; height: 34px; }
.shelf-app .run-dot { position: absolute; bottom: 1px; left: 50%; width: 4px; height: 4px; border-radius: 4px; background: var(--on-surface-variant); transform: translateX(-50%); opacity: 0; transition: width .2s var(--ease), opacity .2s; }
.shelf-app.running .run-dot { opacity: 1; }
.shelf-app.running .run-dot.multi { width: 10px; }
.shelf-app.focused .run-dot { width: 14px; background: var(--primary); }
#status { display: inline-flex; align-items: center; gap: 10px; padding: 0 16px; cursor: pointer; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
#status:hover { background: var(--glass-strong); }
.status-icons { display: inline-flex; align-items: center; gap: 6px; }
.status-icons:empty { display: none; }
.status-icons svg { width: 17px; height: 17px; }
.status-icons .warn { color: var(--warn); }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

/* ---- panels: launcher & quick settings ---- */
.panel {
  position: absolute; bottom: calc(var(--shelf-h) + 4px); z-index: 100001; display: flex; flex-direction: column;
  background: var(--glass-strong); color: var(--on-surface); border-radius: var(--r-xl); box-shadow: var(--shadow-3);
  -webkit-backdrop-filter: blur(32px) saturate(1.5); backdrop-filter: blur(32px) saturate(1.5);
  animation: panel-in .22s var(--ease-out); overflow: hidden;
}
.panel.closing { animation: panel-out .14s var(--ease) forwards; }
@keyframes panel-in { from { opacity: 0; transform: translateY(16px) scale(.98); } }
@keyframes panel-out { to { opacity: 0; transform: translateY(10px) scale(.98); } }
#launcher { left: 10px; width: min(680px, calc(100vw - 20px)); height: min(600px, calc(100vh - var(--shelf-h) - 20px)); }
.launcher-top { position: relative; padding: 16px 16px 8px; }
.ls-ico { position: absolute; left: 32px; top: 50%; transform: translateY(-30%); color: var(--on-surface-variant); pointer-events: none; }
.ls-ico svg { width: 20px; height: 20px; }
.launcher-search { width: 100%; height: 52px; padding: 0 20px 0 50px; border: 0; border-radius: var(--r-full); background: var(--surface-highest); color: var(--on-surface); font-size: 16px; outline: none; }
.launcher-search:focus { box-shadow: inset 0 0 0 2px var(--primary); }
.launcher-search::-webkit-search-cancel-button { display: none; }
.launcher-body { flex: 1; overflow: auto; padding: 8px 16px 18px; }
.lz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.lz-app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px; border: 0; border-radius: var(--r-md); background: transparent; cursor: pointer; }
.lz-app:hover, .lz-app:focus-visible { background: var(--hover); outline: none; }
.lz-app .ico { width: 52px; height: 52px; }
.lz-app .lbl { font-size: 13px; font-weight: 500; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.lz-heading { margin: 18px 6px 8px; font-size: 13px; font-weight: 700; color: var(--on-surface-variant); }
.lz-recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
.lz-file, .lz-result { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: var(--r-md); background: var(--surface-container); cursor: pointer; text-align: left; min-width: 0; }
.lz-file:hover, .lz-result:hover, .lz-result.active { background: var(--secondary-container); color: var(--on-secondary-container); }
.lz-file .ico, .lz-result .ico { width: 32px; height: 32px; flex-shrink: 0; }
.lz-result .ico:not(.app-ico) { padding: 4px; color: var(--on-surface-variant); }
.lz-file-txt { display: flex; flex-direction: column; min-width: 0; }
.lz-file-txt .lbl { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-file-txt .sub { font-size: 12px; color: var(--on-surface-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-results { display: flex; flex-direction: column; gap: 4px; }
.lz-result { background: transparent; }
.lz-empty { padding: 40px; text-align: center; color: var(--on-surface-variant); }

#quick-settings { right: 10px; width: min(380px, calc(100vw - 20px)); max-height: calc(100vh - var(--shelf-h) - 20px); padding: 16px; gap: 14px; overflow: auto; }
.qs-head { display: flex; align-items: center; gap: 12px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 19px; }
.qs-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.qs-who b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qs-who span { font-size: 12.5px; color: var(--on-surface-variant); }
.qs-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qs-tile { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 14px; border: 0; border-radius: var(--r-lg); background: var(--surface-highest); color: var(--on-surface); cursor: pointer; text-align: left; transition: background .15s, border-radius .2s var(--ease); }
.qs-tile:hover { filter: brightness(.97); }
:root[data-theme="dark"] .qs-tile:hover { filter: brightness(1.15); }
.qs-tile.on { background: var(--primary-container); color: var(--on-primary-container); border-radius: var(--r-xl); }
.qs-tile:disabled { opacity: .5; cursor: default; filter: none; }
.qs-ico svg { width: 22px; height: 22px; }
.qs-txt { display: flex; flex-direction: column; min-width: 0; }
.qs-txt b { font-size: 13.5px; }
.qs-txt span { font-size: 12px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qs-slider { display: flex; align-items: center; gap: 12px; padding: 4px 6px; color: var(--on-surface-variant); }
.qs-slider svg { width: 20px; height: 20px; flex-shrink: 0; }
.qs-notifs { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--outline-variant); padding-top: 10px; }
.qs-nhead { display: flex; align-items: center; justify-content: space-between; min-height: 32px; }
.qs-empty { color: var(--on-surface-variant); font-size: 13px; padding: 6px 0 4px; }
.qs-notif { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--r-md); background: var(--surface-container); }
.qs-nico { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--primary-container); color: var(--on-primary-container); }
.qs-nico svg { width: 18px; height: 18px; }
.qs-ntxt { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px; }
.qs-ntxt span { color: var(--on-surface-variant); }
.qs-ntxt small { color: var(--on-surface-variant); opacity: .8; margin-top: 2px; }

/* ---- windows ---- */
#windows { position: absolute; inset: 0 0 var(--shelf-h) 0; pointer-events: none; }
.win {
  position: absolute; display: flex; flex-direction: column; min-width: 160px; min-height: 100px;
  background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-2); pointer-events: auto;
  animation: win-open .2s var(--ease-out); overflow: hidden;
  outline: 1px solid var(--outline-variant); outline-offset: -1px;
}
@keyframes win-open { from { opacity: 0; transform: scale(.94) translateY(8px); } }
.win.closing { animation: win-close .14s var(--ease) forwards; }
@keyframes win-close { to { opacity: 0; transform: scale(.95); } }
.win.minimizing { animation: win-min .16s var(--ease) forwards; }
@keyframes win-min { to { opacity: 0; transform: translateY(40px) scale(.9); } }
.win.focused { box-shadow: var(--shadow-3); outline-color: transparent; }
.win.maximized { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; outline: 0; }
.win.snapped { border-radius: 0; }
.win.minimized { display: none; }
.win-titlebar {
  height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px;
  background: var(--surface-container); user-select: none; -webkit-user-select: none; touch-action: none; cursor: default;
}
.win.focused .win-titlebar { background: var(--surface-high); }
.win-titlebar .ico { width: 20px; height: 20px; flex-shrink: 0; }
.win-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 600; color: var(--on-surface-variant); }
.win.focused .win-title { color: var(--on-surface); }
.win-slot { display: none; }
.win-slot:not(:empty) { display: flex; flex: 1; min-width: 0; align-self: stretch; align-items: flex-end; }
.win-slot:not(:empty) ~ .win-ctrls { margin-left: 0; }
.win-titlebar:has(.win-slot:not(:empty)) .win-title { display: none; }
.win-ctrls { display: flex; gap: 2px; }
.win-ctrl { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--on-surface-variant); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .12s; }
.win-ctrl:hover { background: var(--hover); color: var(--on-surface); }
.win-ctrl.close:hover { background: var(--error); color: var(--on-error); }
.win-ctrl svg { width: 16px; height: 16px; stroke-width: 2.2; }
.win-body { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--surface); }
.win-body:focus { outline: none; }
.win.drop-target .win-body::after {
  content: "Drop to import here"; position: absolute; inset: 10px; border: 2px dashed var(--primary); border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center; background: var(--selected); color: var(--primary); font-weight: 700; pointer-events: none;
}
.rz { position: absolute; z-index: 2; touch-action: none; }
.rz.n { top: 0; left: 12px; right: 12px; height: 6px; cursor: ns-resize; }
.rz.s { bottom: 0; left: 12px; right: 12px; height: 7px; cursor: ns-resize; }
.rz.e { right: 0; top: 12px; bottom: 12px; width: 7px; cursor: ew-resize; }
.rz.w { left: 0; top: 12px; bottom: 12px; width: 7px; cursor: ew-resize; }
.rz.ne { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; }
.rz.nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; }
.rz.se { bottom: 0; right: 0; width: 16px; height: 16px; cursor: nwse-resize; }
.rz.sw { bottom: 0; left: 0; width: 16px; height: 16px; cursor: nesw-resize; }
.win.maximized .rz { display: none; }
.snap-preview { position: absolute; z-index: 99999; border-radius: var(--r-lg); background: var(--selected); border: 2px solid var(--primary); pointer-events: none;
  transition: all .15s var(--ease); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
body.dragging, body.dragging * { user-select: none !important; -webkit-user-select: none !important; }
body.dragging iframe { pointer-events: none; }

/* ---- context menu ---- */
.ctx-menu {
  position: fixed; z-index: 300001; min-width: 220px; max-width: 320px; padding: 6px 0; outline: none;
  background: var(--surface-container); border-radius: var(--r-sm); box-shadow: var(--shadow-3); animation: menu-in .12s var(--ease-out);
}
@keyframes menu-in { from { opacity: 0; transform: scale(.96); } }
.ctx-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 0 14px; border: 0; background: transparent; color: var(--on-surface); cursor: pointer; text-align: left; font-size: 14px; }
.ctx-item:hover, .ctx-item:focus-visible { background: var(--hover); outline: none; }
.ctx-item:disabled { opacity: .4; cursor: default; background: none; }
.ctx-item.danger { color: var(--error); }
.ctx-ico { width: 20px; height: 20px; flex-shrink: 0; color: var(--on-surface-variant); }
.ctx-item.danger .ctx-ico { color: var(--error); }
.ctx-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx-hint { font-size: 12px; color: var(--on-surface-variant); }
.ctx-sep { height: 1px; margin: 6px 0; background: var(--outline-variant); }

/* ---- modal dialogs ---- */
.modal-overlay { position: fixed; inset: 0; z-index: 200000; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s ease-out; }
.modal {
  width: min(420px, 100%); max-height: calc(100% - 16px); display: flex; flex-direction: column;
  background: var(--surface-high); color: var(--on-surface); border-radius: var(--r-xl); box-shadow: var(--shadow-3); animation: pop .2s var(--ease-out);
}
.modal.wide { width: min(620px, 100%); }
.modal-icon { display: flex; justify-content: center; padding-top: 24px; color: var(--primary); }
.modal-icon svg { width: 26px; height: 26px; }
.modal-title { padding: 24px 24px 4px; font-weight: 500; font-size: 22px; line-height: 1.3; }
.modal-title.centered { text-align: center; padding-top: 14px; }
.modal-body { padding: 10px 24px 4px; overflow: auto; line-height: 1.5; color: var(--on-surface-variant); }
.modal-body p { margin: 0 0 10px; }
.modal-body .input { margin-top: 4px; }
.modal-error { color: var(--error); font-size: 13px; min-height: 18px; margin-top: 6px; }
.modal-buttons { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 20px; flex-wrap: wrap; }
.picker { border-radius: var(--r-md); overflow: hidden; margin-top: 8px; background: var(--surface); border: 1px solid var(--outline-variant); }
.picker-crumbs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; border-bottom: 1px solid var(--outline-variant); }
.picker-list { height: 260px; overflow: auto; padding: 4px; }
.picker-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-xs); cursor: pointer; user-select: none; color: var(--on-surface); }
.picker-row:hover { background: var(--hover); }
.picker-row.selected { background: var(--secondary-container); color: var(--on-secondary-container); }
.picker-row.disabled { opacity: .45; cursor: default; }
.picker-row svg { width: 22px; height: 22px; flex-shrink: 0; }
.picker-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-empty { padding: 24px; text-align: center; color: var(--on-surface-variant); }
.crumb { border: 0; background: transparent; padding: 5px 10px; border-radius: var(--r-full); cursor: pointer; color: var(--on-surface-variant); font-size: 13.5px; font-weight: 600; }
.crumb:hover { background: var(--hover); color: var(--on-surface); }
.crumb.current { color: var(--on-surface); }
.crumb-sep { color: var(--outline); padding: 5px 0; font-size: 13px; }
.crumb.drop-over { background: var(--selected); outline: 2px solid var(--primary); }

/* ---- toasts & notices ---- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--shelf-h) + 14px); z-index: 300000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(520px, calc(100vw - 24px)); }
.toast {
  pointer-events: auto; padding: 12px 18px; border-radius: var(--r-xs); max-width: 100%;
  background: var(--on-surface); color: var(--surface); box-shadow: var(--shadow-2); animation: pop .2s var(--ease-out); line-height: 1.4; font-size: 14px;
}
.toast.rich { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; }
.toast-ico { width: 20px; height: 20px; flex-shrink: 0; opacity: .85; }
.toast-txt { flex: 1; min-width: 0; }
.toast-body { opacity: .8; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast .btn.text { color: var(--primary-container); min-height: 36px; }
.toast.error { background: var(--error); color: var(--on-error); }
.toast.hide { opacity: 0; transform: translateY(6px); transition: .22s; }
#notices { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 250000; display: flex; flex-direction: column; gap: 8px; width: min(560px, calc(100vw - 24px)); }
.notice { display: flex; gap: 14px; background: var(--surface-high); color: var(--on-surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3); padding: 16px 18px; line-height: 1.5; animation: pop .2s var(--ease-out); }
.notice-ico { width: 24px; height: 24px; flex-shrink: 0; color: var(--primary); }
.notice-main { flex: 1; min-width: 0; }
.notice .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
.notice label { margin-right: auto; font-size: 13px; color: var(--on-surface-variant); display: flex; gap: 8px; align-items: center; }

/* ---- full-screen layers: splash, lock, setup ---- */
.screen { position: fixed; inset: 0; z-index: 400000; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.screen.hide { opacity: 0; transition: opacity .3s; pointer-events: none; }
#splash { position: fixed; inset: 0; z-index: 500000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--surface); transition: opacity .35s; }
#splash.hide { opacity: 0; pointer-events: none; }
.splash-logo { width: 84px; height: 84px; --logo-bg: var(--primary); animation: breathe 1.6s ease-in-out infinite; }
.splash-name { font-size: 22px; font-weight: 600; letter-spacing: .02em; color: var(--on-surface); }
@keyframes breathe { 50% { transform: scale(.94); opacity: .85; } }

.screen.lock { flex-direction: column; justify-content: space-between; padding: 8vh 16px 10vh; color: #fff; background-color: #141226; }
.screen.lock::before { content: ""; position: absolute; inset: 0; background: rgba(10, 8, 24, .25); pointer-events: none; }
.screen.lock > * { position: relative; }
.lk-top { text-align: center; text-shadow: 0 2px 16px rgba(0,0,0,.4); }
.lk-time { font-size: clamp(64px, 12vw, 120px); font-weight: 300; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.lk-date { font-size: 20px; margin-top: 10px; opacity: .92; }
.lk-card { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(360px, 100%); }
.lk-avatar { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.18); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.lk-avatar svg { width: 30px; height: 30px; }
.lk-title { font-size: 18px; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.lk-form { display: flex; width: 100%; gap: 8px; padding: 6px; border-radius: var(--r-full); background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
.lk-form.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.lk-input { flex: 1; min-width: 0; height: 44px; padding: 0 16px; border: 0; background: transparent; color: #fff; font-size: 16px; outline: none; }
.lk-input::placeholder { color: rgba(255,255,255,.7); }
.lk-go { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; color: #1d1b3a; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.lk-go svg { width: 20px; height: 20px; stroke-width: 2.4; }
.lk-err { min-height: 20px; color: #ffd0d5; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.5); text-align: center; }
.lk-note { font-size: 13px; opacity: .8; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.screen.lock.unlocking { opacity: 0; transform: scale(1.04); transition: .35s var(--ease); }

.screen.setup { background: var(--scrim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.setup-card { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; padding: 32px 32px 22px; border-radius: var(--r-xl); background: var(--surface-low); color: var(--on-surface); box-shadow: var(--shadow-3); }
.setup-card.enter > * { animation: pop .3s var(--ease-out) both; }
.setup-card.enter > :nth-child(2) { animation-delay: .03s; } .setup-card.enter > :nth-child(3) { animation-delay: .06s; } .setup-card.enter > :nth-child(4) { animation-delay: .09s; }
.setup-icon { width: 48px; height: 48px; color: var(--primary); --logo-bg: var(--primary); margin-bottom: 18px; }
.setup-icon svg { width: 100%; height: 100%; }
.setup-card h1 { font-size: 30px; font-weight: 500; letter-spacing: -.01em; margin: 0 0 10px; line-height: 1.2; }
.setup-text { margin: 0 0 18px; color: var(--on-surface-variant); line-height: 1.55; font-size: 15px; }
.setup-body { display: flex; flex-direction: column; gap: 10px; min-height: 40px; }
.setup-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 26px; }
.setup-dots { display: flex; gap: 6px; }
.setup-dots span { width: 8px; height: 8px; border-radius: 4px; background: var(--outline-variant); transition: width .25s var(--ease); }
.setup-dots span.done { background: var(--primary); opacity: .5; }
.setup-dots span.on { width: 22px; background: var(--primary); }
.setup-actions { display: flex; gap: 6px; }
.setup-facts { display: flex; flex-direction: column; gap: 6px; }
.setup-fact { display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-container); }
.setup-fact > span { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--primary-container); color: var(--on-primary-container); }
.setup-fact > span svg { width: 20px; height: 20px; }
.setup-fact div { display: flex; flex-direction: column; font-size: 13.5px; color: var(--on-surface-variant); }
.setup-fact b { color: var(--on-surface); font-size: 14.5px; }
.setup-label { font-weight: 700; font-size: 13px; color: var(--on-surface-variant); margin-top: 6px; }
.setup-hint { color: var(--on-surface-variant); font-size: 13px; margin: 4px 0 0; min-height: 18px; }
.setup-err { color: var(--error); font-size: 13.5px; min-height: 20px; font-weight: 600; }
.wp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.wp-thumb { position: relative; height: 72px; border: 0; border-radius: var(--r-md); cursor: pointer; display: flex; align-items: flex-end; padding: 6px 10px; color: #fff; font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.6); background-size: cover; transition: transform .15s var(--ease); }
.wp-thumb:hover { transform: scale(1.03); }
.wp-thumb.on { box-shadow: 0 0 0 3px var(--surface-low), 0 0 0 6px var(--primary); }
.setup-list { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.setup-list > .btn { align-self: flex-start; margin-top: 6px; }
.setup-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: var(--r-md); background: var(--surface-container); cursor: pointer; }
.setup-row > span:first-child { flex: 1; display: flex; flex-direction: column; }
.setup-row small { color: var(--on-surface-variant); font-size: 12.5px; }
.setup-row .row-ico { flex: 0 0 auto !important; color: var(--on-surface-variant); }
.setup-row .row-ico svg { width: 22px; height: 22px; }
.setup-apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.setup-app { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r-md); background: var(--surface-container); cursor: pointer; }
.setup-app .ico { width: 36px; height: 36px; flex-shrink: 0; }
.sa-txt { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sa-txt small { color: var(--on-surface-variant); }
.setup-app input { width: 20px; height: 20px; accent-color: var(--primary); }
.setup-look { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.setup-look .wp-grid { align-self: stretch; }
.setup-pw { display: flex; flex-direction: column; gap: 10px; }
.setup-save { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.setup-save .setup-facts { align-self: stretch; }
.warnbox { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--error-container); color: var(--on-error-container); font-size: 13.5px; line-height: 1.45; }
.warnbox > span:first-child svg { width: 20px; height: 20px; flex-shrink: 0; }
@media (max-width: 520px) {
  .setup-card { padding: 24px 20px 18px; }
  .setup-card h1 { font-size: 25px; }
  #glance { top: 18px; left: 20px; }
  #desktop-icons { top: 96px; }
  .qs-tiles { grid-template-columns: 1fr 1fr; }
  #status { padding: 0 12px; }
}

/* ---- src/styles/30-apps.css ---- */
/* =====================================================================
   APPS (part 1): Files, Notepad, To-do, Calculator, Paint, Settings,
   Terminal
   ===================================================================== */
.grow { flex: 1; }
.ph-empty { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 48px 20px; text-align: center; color: var(--on-surface-variant); }
.ph-empty > span:first-child { width: 56px; height: 56px; padding: 14px; border-radius: 50%; background: var(--surface-container); color: var(--primary); }
.ph-empty b { color: var(--on-surface); font-size: 16px; }

/* ---- Files ---- */
.app-files { background: var(--surface); }
.fx-bar { display: flex; align-items: center; gap: 4px; padding: 8px 10px; }
.fx-crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0; overflow: hidden; padding: 0 6px; height: 40px; border-radius: var(--r-full); background: var(--surface-container); }
.fx-crumbs .crumb-sep { display: inline-flex; color: var(--outline); padding: 0; }
.fx-crumbs .crumb-sep svg { width: 14px; height: 14px; }
.fx-crumbs .crumb { white-space: nowrap; }
.fx-search-wrap { position: relative; width: 180px; flex-shrink: 1; min-width: 90px; }
.fx-search-wrap > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--on-surface-variant); pointer-events: none; }
.fx-search-wrap svg { width: 17px; height: 17px; }
.fx-search { width: 100%; height: 40px; border: 0; border-radius: var(--r-full); padding: 0 12px 0 36px; background: var(--surface-container); color: var(--on-surface); outline: none; }
.fx-search:focus { box-shadow: inset 0 0 0 2px var(--primary); }
.fx-new { margin-left: 4px; }
.fx-wrap { flex: 1; min-height: 0; display: flex; }
.fx-side { width: 188px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; padding: 4px 8px 10px; overflow: auto; }
.fx-place { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border: 0; border-radius: var(--r-full); background: transparent; color: var(--on-surface-variant); cursor: pointer; font-weight: 600; font-size: 13.5px; text-align: left; }
.fx-place:hover { background: var(--hover); color: var(--on-surface); }
.fx-place.on { background: var(--secondary-container); color: var(--on-secondary-container); }
.fx-place.drop-over { background: var(--selected); box-shadow: inset 0 0 0 2px var(--primary); }
.fx-place svg { width: 20px; height: 20px; }
.fx-place span:nth-child(2) { flex: 1; }
.fx-count { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; background: var(--surface-highest); }
.fx-usage { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-container); color: var(--on-surface-variant); }
.fx-usage svg { width: 20px; height: 20px; }
.fx-usage div { display: flex; flex-direction: column; font-size: 12px; }
.fx-usage b { color: var(--on-surface); font-size: 13.5px; }
.fx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; margin: 0 8px 8px 0; border-radius: var(--r-lg); background: var(--surface-low); overflow: hidden; }
.fx-actions { display: flex; align-items: center; gap: 0; padding: 6px 8px; flex-wrap: wrap; border-bottom: 1px solid var(--outline-variant); }
.fx-actions .btn { padding: 0 10px; }
.fx-list { flex: 1; overflow: auto; outline: none; padding: 4px 6px 10px; }
.fx-list.list .fx-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 96px; align-items: center; gap: 12px; padding: 0 12px; height: 40px; border-radius: var(--r-sm); user-select: none; -webkit-user-select: none; }
.fx-list.list .fx-head { height: 32px; font-size: 12px; font-weight: 700; color: var(--on-surface-variant); position: sticky; top: -4px; background: var(--surface-low); z-index: 1; }
.fx-row:not(.fx-head):hover { background: var(--hover); }
.fx-row.selected, .fx-row.selected:hover { background: var(--secondary-container); color: var(--on-secondary-container); }
.fx-row.cut { opacity: .5; }
.fx-row.drop-over { background: var(--selected); box-shadow: inset 0 0 0 2px var(--primary); }
.fx-row .c-name { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fx-list.list .c-name .ico { width: 24px; height: 24px; flex-shrink: 0; }
.fx-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx-row .c-size, .fx-row .c-date { font-size: 12.5px; color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fx-row.selected .c-size, .fx-row.selected .c-date { color: inherit; opacity: .8; }
.fx-row .c-size { text-align: right; }
.fx-list.list .thumb img { width: 24px; height: 24px; object-fit: cover; border-radius: 5px; }
.fx-list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 6px; align-content: start; padding: 10px; }
.fx-list.grid .fx-row { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: var(--r-md); text-align: center; user-select: none; -webkit-user-select: none; }
.fx-list.grid .c-name { flex-direction: column; gap: 8px; width: 100%; }
.fx-list.grid .c-name .ico { width: 56px; height: 56px; }
.fx-list.grid .thumb { width: 88px !important; height: 66px !important; }
.fx-list.grid .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--r-xs); box-shadow: var(--shadow-1); }
.fx-list.grid .nm { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 13px; line-height: 1.25; word-break: break-word; max-width: 100%; }
.fx-list.grid .c-date { display: none; }
.fx-list.grid .c-size { font-size: 11.5px; text-align: center; }
.fx-empty { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 56px 20px; color: var(--on-surface-variant); text-align: center; }
.fx-empty > span:first-child { width: 56px; height: 56px; padding: 14px; border-radius: 50%; background: var(--surface-container); color: var(--primary); }
.fx-empty b { color: var(--on-surface); font-size: 15px; }
.fx-status { padding: 6px 14px; font-size: 12px; color: var(--on-surface-variant); border-top: 1px solid var(--outline-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.props { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.props th { text-align: left; color: var(--on-surface-variant); font-weight: 600; padding: 6px 16px 6px 0; vertical-align: top; white-space: nowrap; }
.props td { padding: 6px 0; color: var(--on-surface); word-break: break-word; }
@media (max-width: 700px) {
  .fx-side { display: none; }
  .fx-main { margin: 0; border-radius: 0; }
  .fx-search-wrap { width: 120px; }
  .fx-list.list .fx-row { grid-template-columns: minmax(0, 1fr) 80px; }
  .fx-list.list .c-date { display: none; }
  .fx-actions .btn { font-size: 0; gap: 0; padding: 0 8px; }
}

/* ---- Notepad ---- */
.app-notepad .toolbar { border-bottom: 1px solid var(--outline-variant); }
.np-findbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface-container); flex-wrap: wrap; }
.np-find-in { width: 170px; min-height: 34px; padding: 4px 12px; border-radius: var(--r-full); }
.np-main { flex: 1; min-height: 0; display: flex; }
.np-text { flex: 1; border: 0; outline: none; resize: none; padding: 20px 28px; background: var(--surface); color: var(--on-surface); font-family: var(--mono); font-size: 15px; line-height: 1.6; tab-size: 4; }
.np-text.nowrap { white-space: pre; overflow-wrap: normal; overflow-x: auto; }
.np-preview { flex: 1; overflow: auto; padding: 20px 32px; }
.np-status { padding: 6px 16px; font-size: 12px; color: var(--on-surface-variant); background: var(--surface-container); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.md { line-height: 1.65; font-size: 15px; max-width: 760px; }
.md h1, .md h2, .md h3 { line-height: 1.25; margin: 1.1em 0 .5em; font-weight: 600; }
.md h1 { font-size: 1.9em; margin-top: .3em; } .md h2 { font-size: 1.4em; } .md h3 { font-size: 1.15em; }
.md code { font-family: var(--mono); background: var(--surface-container); padding: 2px 6px; border-radius: 6px; font-size: .9em; }
.md pre { background: var(--surface-container); padding: 14px; border-radius: var(--r-sm); overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 1em; padding: 6px 16px; border-left: 4px solid var(--primary); background: var(--surface-low); border-radius: 0 var(--r-xs) var(--r-xs) 0; color: var(--on-surface-variant); }
.md hr { border: 0; border-top: 1px solid var(--outline-variant); margin: 1.5em 0; }
.md li { margin: .2em 0; }

/* ---- To-do ---- */
.app-todo { background: var(--surface); }
.td-head { padding: 18px 18px 10px; }
.td-head h2 { margin: 0 0 12px; font-size: 24px; font-weight: 500; }
.td-add { display: flex; gap: 8px; }
.td-add .input { border-radius: var(--r-full); padding: 8px 18px; background: var(--surface-container); border-color: transparent; }
.td-add .btn { width: 44px; padding: 0; flex-shrink: 0; }
.td-list { list-style: none; margin: 0; padding: 4px 10px; flex: 1; overflow: auto; }
.td-item { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 2px; min-height: 48px; border-radius: var(--r-md); background: var(--surface); margin-bottom: 2px; transition: background .12s; }
.td-item:hover { background: var(--surface-low); }
.td-item.dragging { box-shadow: var(--shadow-3); position: relative; z-index: 2; background: var(--surface-high); }
.td-grip { width: 22px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: grab; color: var(--outline); touch-action: none; flex-shrink: 0; }
.td-grip svg { width: 16px; height: 16px; stroke-width: 3.2; }
.td-check { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--outline); flex-shrink: 0; cursor: pointer; display: grid; place-content: center; margin: 0 4px; transition: .15s; }
.td-check:checked { background: var(--primary); border-color: var(--primary); }
.td-check:checked::after { content: ""; width: 10px; height: 6px; border: solid var(--on-primary); border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px, -1px); }
.td-text { flex: 1; min-width: 0; overflow-wrap: anywhere; padding: 4px; font-size: 15px; }
.td-item.done .td-text { text-decoration: line-through; color: var(--on-surface-variant); }
.td-item .icon-btn { width: 32px; height: 32px; opacity: 0; transition: opacity .12s; }
.td-item:hover .icon-btn, .td-item .icon-btn:focus-visible { opacity: 1; }
@media (hover: none) { .td-item .icon-btn { opacity: .7; } }
.td-item .icon-btn svg { width: 17px; height: 17px; }
.td-edit { flex: 1; }
.td-empty { padding: 40px 20px; text-align: center; color: var(--on-surface-variant); }
.td-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px; min-height: 52px; color: var(--on-surface-variant); }

/* ---- Calculator ---- */
.app-calc { background: var(--surface-container); padding: 14px; gap: 12px; }
.calc-display { position: relative; background: var(--surface); border-radius: var(--r-lg); padding: 16px 18px 14px; text-align: right; min-height: 112px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.calc-tape-btn { position: absolute; top: 8px; left: 8px; }
.calc-expr { font-size: 36px; font-weight: 500; word-break: break-all; font-variant-numeric: tabular-nums; line-height: 1.15; }
.calc-res { font-size: 15px; color: var(--on-surface-variant); min-height: 22px; word-break: break-all; }
.calc-res.err { color: var(--error); }
.calc-tape { flex: 1; min-height: 0; overflow: auto; background: var(--surface); border-radius: var(--r-lg); padding: 6px; }
.calc-tape:not([hidden]) + .calc-pad { display: none; }
.calc-tape-row { display: flex; flex-direction: column; align-items: flex-end; width: 100%; padding: 8px 12px; border: 0; border-radius: var(--r-sm); background: transparent; cursor: pointer; color: var(--on-surface-variant); }
.calc-tape-row:hover { background: var(--hover); }
.calc-tape-row b { color: var(--on-surface); font-size: 18px; }
.calc-tape-empty { padding: 30px; text-align: center; color: var(--on-surface-variant); }
.calc-pad { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 8px; min-height: 0; }
.calc-key { border: 0; border-radius: var(--r-full); background: var(--surface-highest); color: var(--on-surface); font-size: 20px; font-weight: 500; cursor: pointer; min-height: 40px; touch-action: manipulation; transition: border-radius .15s var(--ease), filter .1s; }
.calc-key:hover { filter: brightness(.95); }
:root[data-theme="dark"] .calc-key:hover { filter: brightness(1.2); }
.calc-key:active { border-radius: var(--r-md); }
.calc-key.op { background: var(--secondary-container); color: var(--on-secondary-container); font-weight: 700; }
.calc-key.fn { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.calc-key.eq { grid-column: span 3; background: var(--primary); color: var(--on-primary); font-weight: 700; }

/* ---- Paint ---- */
.app-paint .toolbar { gap: 4px; }
.app-paint .pt-sub { padding-top: 0; border-bottom: 1px solid var(--outline-variant); }
.pt-tools { display: flex; gap: 2px; }
.app-paint input[type=color] { width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; overflow: hidden; }
.app-paint input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.app-paint input[type=color]::-webkit-color-swatch { border: 2px solid var(--outline-variant); border-radius: 50%; }
.app-paint input[type=color]::-moz-color-swatch { border: 2px solid var(--outline-variant); border-radius: 50%; }
.pt-range { width: 120px; }
.pt-size { width: 26px; text-align: right; }
.pt-fill-label { display: flex; align-items: center; gap: 6px; margin-left: 10px; }
.pt-fill-label input { accent-color: var(--primary); width: 16px; height: 16px; }
.pt-swatches { display: flex; gap: 4px; flex-wrap: wrap; }
.pt-swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--outline-variant); cursor: pointer; padding: 0; transition: transform .1s; }
.pt-swatch:hover { transform: scale(1.15); }
@media (max-width: 760px) { .pt-swatches { display: none; } }
.pt-stage { flex: 1; min-height: 0; overflow: auto; padding: 20px; background: var(--surface-container); }
.pt-paper { display: inline-block; box-shadow: var(--shadow-2); line-height: 0; border-radius: 2px;
  background: repeating-conic-gradient(#d9d9d9 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
.pt-canvas { touch-action: none; cursor: crosshair; display: block; }

/* ---- Settings (also used by Store) ---- */
.app-settings, .app-store { flex-direction: row; background: var(--surface-container); }
.st-nav, .sx-nav { width: 236px; flex-shrink: 0; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.st-profile { display: flex; align-items: center; gap: 12px; padding: 6px 10px 16px; }
.st-profile > div:last-child { display: flex; flex-direction: column; min-width: 0; }
.st-profile b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-profile small { color: var(--on-surface-variant); }
.st-tab { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; border: 0; border-radius: var(--r-full); background: transparent; color: var(--on-surface-variant); cursor: pointer; text-align: left; font-weight: 600; font-size: 14px; }
.st-tab:hover { background: var(--hover); color: var(--on-surface); }
.st-tab.active { background: var(--secondary-container); color: var(--on-secondary-container); }
.st-tab svg { width: 22px; height: 22px; }
.st-main, .sx-main { flex: 1; min-width: 0; overflow: auto; padding: 22px 26px 30px; background: var(--surface); border-radius: var(--r-xl) 0 0 0; }
.st-main h2 { margin: 2px 0 18px; font-size: 26px; font-weight: 500; }
.st-card { border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 12px; background: var(--surface-low); }
.st-card h3 { margin: 0 0 6px; font-size: 16px; font-weight: 650; }
.st-desc { margin: 0 0 12px; line-height: 1.5; font-size: 13.5px; color: var(--on-surface-variant); }
.st-sub { font-weight: 700; font-size: 13px; color: var(--on-surface-variant); margin: 14px 0 8px; }
.st-sub:first-of-type { margin-top: 4px; }
.st-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.st-item { display: flex; align-items: center; gap: 16px; padding: 12px 4px; border-bottom: 1px solid var(--outline-variant); cursor: pointer; }
.st-item:last-child { border-bottom: 0; }
.st-item-ico { width: 24px; height: 24px; flex-shrink: 0; color: var(--on-surface-variant); }
.st-item-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.st-item-txt small { color: var(--on-surface-variant); font-size: 12.5px; }
.st-item .input { width: 220px; }
.st-item .range { width: 200px; }
.st-hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.st-hero-side { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.st-hero-side h3 { margin: 0; }
.st-hero-side .st-desc { margin: 0; }
.st-preview { position: relative; width: 260px; height: 160px; border-radius: var(--r-md); overflow: hidden; flex-shrink: 0; box-shadow: var(--shadow-1); background-size: cover !important; }
.st-prev-win { position: absolute; left: 40px; top: 26px; width: 150px; height: 92px; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-2); overflow: hidden; }
.st-prev-bar { height: 16px; background: var(--surface-high); }
.st-prev-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.st-prev-body span { height: 7px; border-radius: 4px; background: var(--primary-container); }
.st-prev-body span:first-child { width: 60%; background: var(--primary); }
.st-prev-body span:last-child { width: 80%; }
.st-prev-shelf { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 5px; padding: 5px 9px; border-radius: 12px; background: var(--glass); }
.st-prev-shelf i { width: 11px; height: 11px; border-radius: 50%; background: var(--primary); }
.st-prev-shelf i:nth-child(2) { background: var(--tertiary-container); }
.st-prev-shelf i:nth-child(3) { background: var(--secondary-container); }
.st-color { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; }
.st-color input { width: 36px; height: 36px; border: 0; border-radius: 50%; padding: 0; background: none; cursor: pointer; }
.st-color input::-webkit-color-swatch-wrapper { padding: 0; }
.st-color input::-webkit-color-swatch { border: 2px solid var(--outline-variant); border-radius: 50%; }
.st-accents { display: flex; gap: 10px; flex-wrap: wrap; }
.st-accent { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .12s; }
.st-accent:hover { transform: scale(1.08); }
.st-accent.auto { background: var(--surface-highest); color: var(--primary); }
.st-accent.auto svg { width: 20px; height: 20px; }
.st-accent.on { box-shadow: 0 0 0 3px var(--surface-low), 0 0 0 5px var(--on-surface); }
.st-sounds { display: flex; flex-wrap: wrap; gap: 8px; }
.st-applist { display: flex; flex-direction: column; gap: 2px; }
.st-app { display: flex; align-items: center; gap: 12px; padding: 8px 4px; border-bottom: 1px solid var(--outline-variant); flex-wrap: wrap; }
.st-app:last-child { border-bottom: 0; }
.st-app .ico { width: 36px; height: 36px; flex-shrink: 0; }
.st-app-txt { flex: 1; min-width: 100px; display: flex; flex-direction: column; }
.st-app-txt small { color: var(--on-surface-variant); }
.st-sys { width: 32px; text-align: center; font-size: 11px; }
.st-status { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r-md); margin-bottom: 12px; }
.st-status > span svg { width: 26px; height: 26px; }
.st-status > div { display: flex; flex-direction: column; }
.st-status small { opacity: .85; }
.st-status.ok { background: var(--primary-container); color: var(--on-primary-container); }
.st-status.off { background: var(--surface-highest); }
.st-big { font-size: 34px; font-weight: 500; margin-bottom: 8px; }
.st-big small { font-size: 15px; color: var(--on-surface-variant); font-weight: 400; }
.st-big.warn { color: var(--warn); }
.st-meter { height: 10px; border-radius: 5px; background: var(--secondary-container); overflow: hidden; margin-bottom: 14px; }
.st-meter span { display: block; height: 100%; border-radius: 5px; background: var(--primary); }
.st-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
.st-table th, .st-table td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--outline-variant); }
.st-table tr:last-child td { border-bottom: 0; }
.st-table td:last-child, .st-table th:last-child { text-align: right; }
.st-table a { color: var(--primary); text-decoration: none; word-break: break-all; }
.st-about { display: flex; align-items: center; gap: 18px; }
.st-logo { width: 64px; height: 64px; --logo-bg: var(--primary); flex-shrink: 0; }
.st-about h3 { font-size: 22px; font-weight: 600; margin: 0; }
.st-about .st-desc { margin: 2px 0 0; }
.st-tips { margin: 0; padding-left: 20px; line-height: 1.7; color: var(--on-surface-variant); font-size: 13.5px; }
@media (max-width: 680px) {
  .app-settings, .app-store { flex-direction: column; }
  .st-nav, .sx-nav { width: auto; flex-direction: row; padding: 8px; overflow-x: auto; flex-shrink: 0; }
  .st-profile, .sx-brand, .sx-nav .grow { display: none !important; }
  .st-tab { flex-shrink: 0; min-height: 40px; padding: 0 14px; }
  .st-tab span:last-child { white-space: nowrap; }
  .st-main, .sx-main { padding: 16px; border-radius: 0; }
  .st-item .input, .st-item .range { width: 130px; }
  .st-preview { width: 100%; }
}

/* ---- Terminal ---- */
.app-terminal { background: #101318; }
.term { flex: 1; overflow: auto; padding: 12px 14px; font-family: var(--mono); font-size: 13.5px; line-height: 1.55; color: #d6dbe5; cursor: text; }
.term-row { white-space: pre-wrap; word-break: break-word; }
.term-row.cmd { color: #ffffff; }
.term-row.err { color: #ff8f8f; }
.term-row.muted { color: #8892a6; }
.term-line { display: flex; align-items: baseline; }
.term-prompt { color: #86e3b3; white-space: pre; flex-shrink: 0; }
.term-in { flex: 1; min-width: 40px; border: 0; outline: none; background: transparent; color: #fff; font: inherit; padding: 0; caret-color: #86e3b3; }

/* ---- src/styles/40-apps-more.css ---- */
/* =====================================================================
   APPS (part 2): Store, Browser, Photos, Music, Clock, Solitaire,
   Comet, Sudoku
   ===================================================================== */

/* ---- Store ---- */
.sx-brand { display: flex; align-items: center; gap: 12px; padding: 4px 12px 16px; font-size: 18px; }
.sx-brand .ico { width: 34px; height: 34px; }
.sx-nav .grow { flex: 1; }
.sx-hero { position: relative; display: flex; align-items: center; gap: 24px; padding: 28px 30px; border-radius: var(--r-xl); background: var(--primary-container); color: var(--on-primary-container); overflow: hidden; cursor: pointer; margin-bottom: 8px; }
.sx-hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: var(--primary); opacity: .12; }
.sx-hero-txt { flex: 1; position: relative; z-index: 1; }

.sx-hero .btn.tonal { background: var(--surface); color: var(--primary); }
.sx-hero-ico { width: 120px; height: 120px; flex-shrink: 0; position: relative; z-index: 1; filter: drop-shadow(0 10px 22px rgba(0,0,0,.2)); transform: rotate(-8deg); }
.sx-h { margin: 24px 0 12px; font-size: 18px; font-weight: 650; }
.sx-title { margin: 2px 0 18px; font-size: 26px; font-weight: 500; }
.sx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.sx-card { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r-lg); background: var(--surface-low); cursor: pointer; transition: background .15s; }
.sx-card:hover { background: var(--surface-container); }
.sx-card:focus-visible { outline: 3px solid var(--focus-ring); }
.sx-card .ico { width: 52px; height: 52px; flex-shrink: 0; }
.sx-card-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sx-card-txt b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sx-card-txt small { color: var(--on-surface-variant); }

/* ---- Photos ---- */
.app-photos { background: var(--surface); }

/* ---- Music ---- */

.mu-player { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 26px 22px; }
.mu-art { --h: 260; position: relative; width: 220px; height: 220px; border-radius: var(--r-xl); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.9); box-shadow: var(--shadow-2);
  background: linear-gradient(135deg, hsl(var(--h) 60% 55%), hsl(calc(var(--h) + 60) 65% 40%)); transition: border-radius .4s var(--ease), transform .4s var(--ease); }
.mu-player.playing .mu-art { border-radius: 50%; transform: scale(.96); }
.mu-art > span svg { width: 76px; height: 76px; }

.mu-player.playing .mu-eq { display: flex; }
.mu-info { text-align: center; max-width: 100%; }
.mu-title { font-size: 19px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mu-sub { font-size: 13px; }
.mu-seekrow { display: flex; align-items: center; gap: 10px; width: 100%; }

.mu-ctrls { display: flex; align-items: center; gap: 6px; }

.mu-one { position: absolute; font-size: 9px; top: 9px; right: 9px; }
.mu-play { width: 64px; height: 64px; border: 0; border-radius: var(--r-lg); background: var(--primary); color: var(--on-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-radius .2s var(--ease); }

@media (max-width: 700px) { .app-music { flex-direction: column-reverse; } .mu-player { width: auto; padding: 14px; } .mu-art { width: 120px; height: 120px; } .mu-side { border-radius: 0; } }

/* ---- Clock ---- */

.ck-tabs { display: flex; justify-content: center; gap: 4px; padding: 12px; }
.ck-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 76px; padding: 6px 10px; border: 0; background: transparent; color: var(--on-surface-variant); cursor: pointer; font-size: 12px; font-weight: 600; }
.ck-tab > span:first-child { width: 56px; height: 32px; border-radius: var(--r-full); display: flex; align-items: center; justify-content: center; transition: background .2s; }
.ck-tab svg { width: 22px; height: 22px; }
.ck-tab:hover > span:first-child { background: var(--hover); }
.ck-tab.on { color: var(--on-surface); }
.ck-tab.on > span:first-child { background: var(--secondary-container); color: var(--on-secondary-container); }
.ck-page { flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 24px 24px; }
.ck-face { width: min(260px, 60vw); aspect-ratio: 1; }
.ck-face svg { width: 100%; height: 100%; }
.ck-bg { fill: var(--surface-container); }
.ck-marks line { stroke: var(--on-surface-variant); stroke-linecap: round; }
.ck-h, .ck-m { stroke: var(--on-surface); stroke-linecap: round; }

.ck-s { stroke: var(--primary); stroke-width: 2; stroke-linecap: round; }

.ck-add { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; align-items: center; }
.ck-add .input { flex: 1; min-width: 120px; }
.ck-add .input[type=time] { flex: 0 0 140px; }
.ck-ring { position: relative; width: min(280px, 64vw); aspect-ratio: 1; }
.ck-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ck-track { fill: none; stroke: var(--surface-highest); stroke-width: 10; }
.ck-prog { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 1000; transition: stroke-dashoffset .2s linear; }
.ck-ring.setup .ck-prog { display: none; }
.ck-ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 44px; font-weight: 500; font-variant-numeric: tabular-nums; }

.ck-num { width: 64px; text-align: center; font-size: 24px; padding: 6px 4px; }

/* ---- Solitaire ---- */
.app-solitaire .so-bar { background: #10462e; color: #fff; }
.app-solitaire .so-bar .btn.tonal { background: rgba(255,255,255,.14); color: #fff; }
.app-solitaire .so-bar .btn.text { color: #d5f5e3; }
.app-solitaire .so-bar .chip { color: #d5f5e3; border-color: rgba(255,255,255,.3); }
.so-info { font-size: 13px; opacity: .85; font-variant-numeric: tabular-nums; }
.so-board { position: relative; flex: 1; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #237a50, #134a31 75%); touch-action: none; user-select: none; -webkit-user-select: none; }
.so-slot { position: absolute; left: 0; top: 0; border-radius: calc(var(--cw) * .1); border: 2px solid rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.28); font-size: calc(var(--cw) * .42); }
.so-slot.stock { cursor: pointer; }
.so-slot.stock svg { width: 40%; height: 40%; }
.so-slot.stock:not(.empty) svg { display: none; }
.so-card { position: absolute; left: 0; top: 0; border-radius: calc(var(--cw) * .1); cursor: pointer; transition: transform .22s var(--ease); will-change: transform; }
.so-board.dragging .so-card.lift { transition: none; filter: drop-shadow(0 12px 18px rgba(0,0,0,.35)); }
.so-board.dealing .so-card { transition: transform .45s var(--ease-out); }
.so-card.nope { animation: shake .3s; }
.so-face, .so-back { position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.so-face { display: none; background: #fdfdfb; color: #1b1d26; overflow: hidden; }
.so-face.red { color: #c8332f; }
.so-card.up .so-face { display: block; }
.so-card.up .so-back { display: none; }
.so-back { border: calc(var(--cw) * .045) solid #fff; background: repeating-linear-gradient(45deg, var(--primary) 0 6px, var(--on-primary-container) 6px 12px); }
.so-corner { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 1; font-size: calc(var(--cw) * .2); }
.so-corner b { font-weight: 700; }
.so-corner i { font-style: normal; font-size: .9em; }
.so-corner.tl { left: 6%; top: 5%; }
.so-corner.br { right: 6%; bottom: 5%; transform: rotate(180deg); }
.so-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cw) * .48); }
.so-center.court { font-weight: 800; font-size: calc(var(--cw) * .42); opacity: .9; }
.so-board.won .so-card { animation: bounce 1s var(--ease) infinite alternate; }
.so-board.won .so-card:nth-child(3n) { animation-delay: .15s; } .so-board.won .so-card:nth-child(3n+1) { animation-delay: .3s; }
@keyframes bounce { to { filter: brightness(1.15) drop-shadow(0 0 12px rgba(255,230,120,.6)); } }

/* ---- Comet ---- */
.app-comet { background: #070a1c; }

.cm-card { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 32px; border-radius: var(--r-xl); background: rgba(20, 24, 52, .82); color: #fff; text-align: center; max-width: 340px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.cm-card h2 { margin: 0; font-size: 30px; font-weight: 600; }

.cm-modes { border-color: rgba(255,255,255,.35); }

/* ---- Sudoku ---- */
.app-sudoku { background: var(--surface); align-items: center; padding: 12px 16px 16px; gap: 12px; overflow: auto; }
.app-sudoku:focus { outline: none; }
.sd-top { display: flex; align-items: center; gap: 12px; width: min(540px, 100%); flex-wrap: wrap; }
.sd-levels .seg-btn { min-height: 36px; padding: 0 14px; }
.sd-board-wrap { width: min(540px, 100%); flex-shrink: 0; }
.sd-grid { display: grid; grid-template-columns: repeat(9, 1fr); aspect-ratio: 1; border: 2px solid var(--on-surface); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.sd-cell { position: relative; border: 0; border-right: 1px solid var(--outline-variant); border-bottom: 1px solid var(--outline-variant); background: var(--surface); color: var(--primary); font-size: clamp(16px, 4.2vw, 28px); font-weight: 600; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.sd-cell:nth-child(9n) { border-right: 0; }
.sd-cell:nth-child(n+73) { border-bottom: 0; }
.sd-cell.br { border-right: 2px solid var(--on-surface); }
.sd-cell.bb { border-bottom: 2px solid var(--on-surface); }
.sd-cell.given { color: var(--on-surface); font-weight: 500; }
.sd-cell.peer { background: var(--surface-container); }
.sd-cell.same { background: var(--primary-container); color: var(--on-primary-container); }
.sd-cell.sel { background: var(--primary); color: var(--on-primary); }
.sd-cell.wrong { color: var(--error); background: var(--error-container); }
.sd-cell.wrong.sel { background: var(--error); color: var(--on-error); }
.sd-grid.solved .sd-cell { animation: pop .4s var(--ease-out) both; }
.sd-notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); font-size: clamp(8px, 1.4vw, 11px); font-weight: 600; color: var(--on-surface-variant); line-height: 1; }
.sd-notes i { font-style: normal; display: flex; align-items: center; justify-content: center; }

.sd-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.sd-pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; width: min(540px, 100%); }
.sd-num { position: relative; aspect-ratio: .82; max-height: 64px; border: 0; border-radius: var(--r-md); background: var(--secondary-container); color: var(--on-secondary-container); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: border-radius .15s var(--ease); }

.sd-num:disabled { opacity: .3; cursor: default; }
.sd-pad.notes .sd-num { background: var(--tertiary-container); color: var(--on-tertiary-container); }
