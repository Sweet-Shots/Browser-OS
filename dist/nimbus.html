/* =====================================================================
   CORE 3: OS CORE (state, dirty tracking, app registry, launching)
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util;

  OS.events = new U.Emitter();
  OS.state = null;          // decrypted, live data object (null while locked)
  OS.dirty = false;         // unsaved changes compared to the file on disk
  OS.changeCounter = 0;     // bumps on every markDirty(); used by the backup timer
  OS.apps = new Map();

  /** Mark data as changed (unsaved). Called by the VFS and by apps. */
  OS.markDirty = function () {
    if (!OS.state) return;
    OS.dirty = true;
    OS.changeCounter++;
    OS.events.emit('dirty', true);
  };
  OS.clearDirty = function () { OS.dirty = false; OS.events.emit('dirty', false); };

  /**
   * Register an app. See the example at the end of the script.
   * def: { id, name, icon (svg string), fileTypes?, defaultSize?, singleInstance?, hidden?, launch(win, args),
   *        optional? (installable from the Store), category?, description?, priority? (wins file associations) }
   */
  OS.registerApp = function (def) {
    if (!def || !def.id || typeof def.launch !== 'function') throw new Error('registerApp: id and launch() are required');
    if (!/^[a-z0-9][a-z0-9_-]{0,40}$/i.test(def.id)) throw new Error('registerApp: invalid id "' + def.id + '"');
    if (OS.apps.has(def.id)) throw new Error('registerApp: an app with id "' + def.id + '" already exists');
    OS.apps.set(def.id, Object.assign({
      name: def.id, icon: OS.appIcons.generic, fileTypes: [], defaultSize: { w: 640, h: 440 }, singleInstance: false,
      optional: false, category: 'Utilities', description: '', priority: 0
    }, def));
    OS.events.emit('apps-changed');
  };

  /** Core apps are always installed; optional ones only if listed in data.installed. */
  OS.isInstalled = function (appId) {
    var a = OS.apps.get(appId);
    if (!a) return false;
    if (a.sideloaded) return true;
    return !a.optional || !!(OS.state && OS.state.installed.indexOf(appId) >= 0);
  };
  /** Installed, visible apps in display order. */
  OS.installedApps = function () {
    var out = [];
    OS.apps.forEach(function (a) { if (!a.hidden && OS.isInstalled(a.id)) out.push(a); });
    return out.sort(function (a, b) { return a.name.localeCompare(b.name); });
  };
  OS.installApp = function (appId) {
    var a = OS.apps.get(appId);
    if (!a || !a.optional || OS.isInstalled(appId)) return;
    OS.state.installed.push(appId);
    OS.markDirty();
    OS.events.emit('apps-changed');
  };
  OS.uninstallApp = async function (appId) {
    var a = OS.apps.get(appId);
    if (!a || !a.optional) return false;
    var wins = OS.wm.findByApp(appId);
    for (var i = 0; i < wins.length; i++) if (!(await wins[i].close())) return false;
    OS.state.installed = OS.state.installed.filter(function (x) { return x !== appId; });
    var st = OS.state.settings;
    st.shelf = st.shelf.filter(function (x) { return x !== appId; });
    st.desktopApps = st.desktopApps.filter(function (x) { return x !== appId; });
    OS.markDirty();
    OS.events.emit('apps-changed');
    return true;
  };

  /** Per-app persistent state stored in the saved data (data.apps[appId]). */
  OS.getAppState = function (appId, defaults) {
    if (!OS.state) return defaults || {};
    var s = OS.state.apps[appId];
    if (!s) { s = OS.state.apps[appId] = JSON.parse(JSON.stringify(defaults || {})); }
    return s;
  };
  OS.setAppState = function (appId, value) {
    if (!OS.state) return;
    OS.state.apps[appId] = JSON.parse(JSON.stringify(value));
    OS.markDirty();
  };

  /** Launch an app (or focus the existing window of a single-instance app). */
  OS.launch = function (appId, args) {
    var app = OS.apps.get(appId);
    if (!app || !OS.state) return null;
    if (!OS.isInstalled(appId)) {
      OS.toast(app.name + ' is not installed. Get it from the Store.');
      return null;
    }
    args = args || {};
    if (app.singleInstance) {
      var existing = OS.wm.findByApp(appId)[0];
      if (existing) { existing.focus(); if (existing._onRelaunch) existing._onRelaunch(args); return existing; }
    }
    var win = OS.wm.create(app);
    // after the app has rendered, give the window keyboard focus unless the app focused something itself
    setTimeout(function () { if (!win.closed && !win.el.contains(document.activeElement)) win.body.focus({ preventScroll: true }); }, 50);
    try { app.launch(win, args); }
    catch (err) {
      console.error(err);
      win.close(true);
      OS.dialogs.alert('The app "' + app.name + '" failed to start: ' + err.message, { title: 'App error' });
      return null;
    }
    return win;
  };

  /** All installed apps that can open a file, best match first (extension beats MIME type, then priority). */
  OS.appsForFile = function (name, mime) {
    var ext = U.extOf(name), list = [];
    OS.apps.forEach(function (app) {
      if (!OS.isInstalled(app.id)) return;
      var score = 0;
      if (ext && app.fileTypes.indexOf(ext) >= 0) score = 2;
      else if (mime && (app.mimeTypes || []).some(function (m) { return mime.indexOf(m) === 0; })) score = 1;
      if (score) list.push({ app: app, score: score * 100 + (app.priority || 0) });
    });
    return list.sort(function (a, b) { return b.score - a.score; }).map(function (x) { return x.app; });
  };
  OS.appForFile = function (name, mime) { return OS.appsForFile(name, mime)[0] || null; };
  /** Open a file with a specific app. */
  OS.openWith = function (appId, fileId) { return OS.launch(appId, { fileId: fileId }); };

  /** Open a VFS file in the right app. */
  OS.openFile = function (fileId) {
    var vfs = OS.vfs;
    var node = vfs.stat(fileId);
    if (!node) return null;
    if (node.type === 'folder') return OS.launch('explorer', { folderId: fileId });
    var app = OS.appForFile(node.name, node.mime);
    if (app) return OS.launch(app.id, { fileId: fileId });
    OS.dialogs.choose('No app can open "' + node.name + '". Do you want to export it to your computer instead?',
      [{ label: 'Cancel', value: null }, { label: 'Export', value: 'export', primary: true }], { title: 'Open file' })
      .then(function (v) { if (v === 'export') OS.exportFile(fileId); });
    return null;
  };

  /**
   * Notifications: a toast now, and an entry in the quick settings panel.
   * opts: { icon (glyph name), sound (name or false), action: { label, run } }
   */
  OS.notifications = [];
  OS.notify = function (title, body, opts) {
    opts = opts || {};
    var n = { id: U.uid(4), title: title, body: body || '', icon: opts.icon || 'bell', at: Date.now(), action: opts.action || null, app: opts.app || null };
    OS.notifications.unshift(n);
    if (OS.notifications.length > 50) OS.notifications.pop();
    if (opts.sound !== false) OS.sound.play(opts.sound || 'notify');
    OS.toast(n, opts.type);
    OS.events.emit('notifications');
    return n;
  };

  /** Download a VFS file to the host computer with its original name and type. */
  OS.exportFile = function (fileId) {
    var node = OS.vfs.stat(fileId);
    if (!node || node.type !== 'file') return;
    var bytes = OS.vfs.readBytes(fileId);
    U.downloadBlob(new Blob([bytes], { type: node.mime || 'application/octet-stream' }), node.name);
  };

  /** Import File objects from the host into a VFS folder. Returns created ids. */
  OS.importHostFiles = async function (files, folderId) {
    var ids = [], errors = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      try {
        var buf = new Uint8Array(await f.arrayBuffer());
        var name = OS.vfs.uniqueName(folderId, f.name || 'file');
        var mime = f.type || OS.vfs.guessMime(name);
        var text = null;
        // Store as text only if it is valid UTF-8 and looks textual; otherwise base64. Both round-trip byte-exactly.
        if (OS.vfs.isTextLike(name, mime) && buf.length < 20 * 1024 * 1024) {
          try { text = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true }).decode(buf); } catch (e) { text = null; }
        }
        var id = text !== null
          ? OS.vfs.createFile(folderId, name, text, { mime: mime })
          : OS.vfs.createFile(folderId, name, U.bytesToB64(buf), { encoding: 'base64', mime: mime });
        ids.push(id);
      } catch (err) { errors.push((f.name || 'file') + ': ' + err.message); }
    }
    if (ids.length) OS.notify('Imported ' + ids.length + ' file' + (ids.length > 1 ? 's' : ''), 'Saved to ' + OS.vfs.pathOf(folderId), { icon: 'upload', action: { label: 'Show', run: function () { OS.launch('explorer', { folderId: folderId, select: ids[ids.length - 1] }); } } });
    if (errors.length) OS.dialogs.alert('Some files could not be imported:\n' + errors.join('\n'), { title: 'Import' });
    return ids;
  };
})();

/* =====================================================================
   CORE 4: STORAGE
   - data model + defaults + migrations
   - reading the embedded <script id="os-data"> tag
   - safe JSON escaping
   - building the saved HTML from the pristine snapshot
   - save paths: File System Access API (Chromium) / download fallback
   - crash-recovery backup in browser storage (never primary storage)
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util;

  var SCHEMA_VERSION = 3;
  var APP_NAME = 'Nimbus';

  function now() { return Date.now(); }

  /** Optional apps installed on a fresh system (the setup wizard can change this). */
  var DEFAULT_INSTALLED = ['browser', 'photos', 'music', 'clock', 'solitaire', 'comet', 'sudoku', 'todo', 'calculator', 'paint', 'terminal'];
  var DEFAULT_SHELF = ['explorer', 'browser', 'notepad', 'photos', 'store', 'settings'];
  var DEFAULT_DESKTOP_APPS = ['explorer', 'browser', 'store'];

  function welcomeText() {
    return '# Welcome to Nimbus\n\nEverything you see lives inside **one HTML file**: the system, the apps, and all your files.\n\n' +
      '## Saving\n' +
      '- Press **Ctrl+S** (or **Cmd+S**), or click the status area in the corner and choose *Save*.\n' +
      '- In Chrome or Edge, pick this same file when asked; later saves overwrite it in one keystroke.\n' +
      '- In Firefox or Safari, a fresh copy is downloaded. Replace the old file with it.\n\n' +
      '## Getting around\n' +
      '- Click the circle in the bottom-left corner (or press **Ctrl+K**) to search apps and files.\n' +
      '- Right-click almost anything for more options.\n' +
      '- Drag a window to the left or right edge to snap it, or to the top to maximize it.\n' +
      '- Drag files from your computer onto the desktop or into Files to import them.\n' +
      '- Get more apps and games in the **Store**.\n\n' +
      'Try the *Terminal* and type `help`.\n';
  }

  function defaultTree() {
    var t = now();
    var nodes = {};
    function folder(id, name, parent, extra) { nodes[id] = Object.assign({ id: id, name: name, type: 'folder', parent: parent, created: t, modified: t, children: [] }, extra || {}); if (parent) nodes[parent].children.push(id); }
    function file(id, name, parent, content, mime) { nodes[id] = { id: id, name: name, type: 'file', parent: parent, created: t, modified: t, encoding: 'text', mime: mime, content: content }; nodes[parent].children.push(id); }
    folder('root', '', null);
    folder('f-desk', 'Desktop', 'root');
    folder('f-docs', 'Documents', 'root');
    folder('f-pics', 'Pictures', 'root');
    folder('f-music', 'Music', 'root');
    folder('f-trash', 'Trash', 'root', { hidden: true });
    file('f-welcome', 'Welcome.md', 'f-docs', welcomeText(), 'text/markdown');
    return { root: 'root', nodes: nodes, special: { desktop: 'f-desk', documents: 'f-docs', pictures: 'f-pics', music: 'f-music', trash: 'f-trash' } };
  }

  function defaultSettings() {
    return {
      theme: 'auto',
      wallpaper: { type: 'preset', value: 'peaks' },
      accent: 'auto',
      iconStyle: 'colorful',
      userName: '',
      clock24: false,
      sound: { enabled: true, volume: 0.6, ui: true },
      shelf: DEFAULT_SHELF.slice(),
      desktopApps: DEFAULT_DESKTOP_APPS.slice(),
      browser: { searchEngine: 'wikipedia' },
      fallbackNoticeDismissed: false
    };
  }

  function defaultData() {
    return {
      version: SCHEMA_VERSION,
      fileId: U.uid(16),
      savedAt: 0,
      setupDone: false,
      settings: defaultSettings(),
      installed: DEFAULT_INSTALLED.slice(),
      sideloaded: [],
      vfs: defaultTree(),
      apps: { todo: { items: [
        { id: U.uid(6), text: 'Save Nimbus with Ctrl+S', done: false },
        { id: U.uid(6), text: 'Drag a photo onto the desktop', done: false },
        { id: U.uid(6), text: 'Find a game in the Store', done: false }
      ] } },
      windows: {}
    };
  }

  /** Make sure the well-known folders exist (used by the v2 -> v3 migration and for repairs). */
  function ensureSpecialFolders(d) {
    var nodes = d.vfs.nodes, root = nodes[d.vfs.root], t = now();
    d.vfs.special = d.vfs.special || {};
    [['desktop', 'Desktop'], ['documents', 'Documents'], ['pictures', 'Pictures'], ['music', 'Music'], ['trash', 'Trash']].forEach(function (p) {
      var key = p[0], name = p[1], id = d.vfs.special[key];
      if (id && nodes[id] && nodes[id].type === 'folder') return;
      // reuse an existing root folder with that name if there is one
      id = root.children.find(function (c) { return nodes[c] && nodes[c].type === 'folder' && nodes[c].name.toLowerCase() === name.toLowerCase(); });
      if (!id) {
        id = 'f-' + key + '-' + U.uid(4);
        nodes[id] = { id: id, name: name, type: 'folder', parent: root.id, created: t, modified: t, children: [] };
        root.children.push(id);
      }
      if (key === 'trash') nodes[id].hidden = true;
      d.vfs.special[key] = id;
    });
  }

  /**
   * Migrations: migrations[n] upgrades a version-n object to version n+1.
   * Add a new entry (and bump SCHEMA_VERSION) whenever the data shape changes.
   */
  var OLD_GRADIENTS = { aurora: 'bloom', ocean: 'tide', sunset: 'dunes', forest: 'meadow', dusk: 'dusk', mono: 'peaks' };
  var migrations = {
    // v1 had no clock setting and stored window geometry under "geometry".
    1: function (d) {
      d.settings = d.settings || {};
      if (d.settings.clock24 == null) d.settings.clock24 = false;
      if (d.geometry && !d.windows) { d.windows = d.geometry; }
      delete d.geometry;
    },
    // v2 -> v3 (Nimbus): new folders and trash, installable apps, shelf, sounds, new wallpapers.
    2: function (d) {
      var s = d.settings = d.settings || {};
      if (s.wallpaper && s.wallpaper.type === 'gradient') s.wallpaper = { type: 'preset', value: OLD_GRADIENTS[s.wallpaper.value] || 'peaks' };
      if (!d.installed) d.installed = DEFAULT_INSTALLED.slice();
      if (!d.sideloaded) d.sideloaded = [];
      if (d.vfs && d.vfs.nodes) ensureSpecialFolders(d);
    }
  };

  function migrate(d) {
    if (!d || typeof d !== 'object') throw new Error('Data is not an object');
    if (!d.version) d.version = 1;
    if (d.version > SCHEMA_VERSION) throw new Error('This file was saved by a newer version of Nimbus (data v' + d.version + ').');
    while (d.version < SCHEMA_VERSION) {
      var m = migrations[d.version];
      if (!m) throw new Error('No migration from data v' + d.version);
      m(d);
      d.version++;
    }
    // Fill anything missing (also repairs partially broken files).
    var def = defaultData();
    if (!d.fileId) d.fileId = def.fileId;
    d.settings = Object.assign({}, def.settings, d.settings || {});
    d.settings.sound = Object.assign({}, def.settings.sound, d.settings.sound || {});
    d.settings.browser = Object.assign({}, def.settings.browser, d.settings.browser || {});
    if (!d.vfs || !d.vfs.nodes || !d.vfs.nodes[d.vfs.root]) d.vfs = def.vfs;
    ensureSpecialFolders(d);
    if (!Array.isArray(d.installed)) d.installed = def.installed;
    if (!Array.isArray(d.sideloaded)) d.sideloaded = [];
    d.apps = d.apps || {};
    d.windows = d.windows || {};
    if (d.setupDone == null) d.setupDone = true;
    d.savedAt = d.savedAt || 0;
    return d;
  }

  /** Read the JSON embedded in this file. Returns null for a fresh template. */
  function readEmbedded() {
    var el = document.getElementById('os-data');
    var txt = el ? el.textContent.trim() : '';
    if (!txt || txt === 'null') return null;
    return JSON.parse(txt);
  }

  /**
   * Make JSON safe to place inside <script type="application/json">.
   * "<" becomes \u003c, which neutralizes a closing script tag and HTML comment openers.
   * U+2028/U+2029 are escaped as well. The result is still valid JSON.
   */
  function escapeJSON(json) {
    return json.replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  }

  /** Strip anything not part of the original template (e.g. extension-injected nodes). */
  function sanitizeClone(root) {
    ['head', 'body'].forEach(function (tag) {
      var part = root.querySelector(tag);
      if (!part) return;
      Array.from(part.children).forEach(function (c) { if (!c.hasAttribute('data-keep')) c.remove(); });
      Array.from(part.attributes).forEach(function (a) { part.removeAttribute(a.name); });
    });
    Array.from(root.attributes).forEach(function (a) { if (a.name !== 'lang') root.removeAttribute(a.name); });
    var r = root.querySelector('#os-root');
    if (r) r.textContent = '';
  }

  /** Build the complete HTML document for a payload (plain data or encrypted envelope). */
  function buildHTML(payload) {
    var json = escapeJSON(JSON.stringify(payload));
    var out = '<!DOCTYPE html>\n';
    __OS_PRISTINE__.forEach(function (n) {
      if (n.nodeType === 10) return;                                  // doctype: written above
      if (n.nodeType === 8) { out += '<!' + '--' + n.data + '--' + '>\n'; return; } // README comment
      if (n.nodeType === 1) {
        var c = n.cloneNode(true);
        sanitizeClone(c);
        var tag = c.querySelector('#os-data');
        if (!tag) throw new Error('Template is missing the os-data tag');
        tag.textContent = json;
        out += c.outerHTML + '\n';
      }
    });
    return out;
  }

  /** Serialized size of the live data in bytes (what goes into the tag, before encryption). */
  function dataSize() {
    if (!OS.state) return 0;
    return new Blob([JSON.stringify(OS.state)]).size;
  }

  /* ------------------------- saving ------------------------- */
  var fileHandle = null;      // File System Access handle, memory only, per session
  var saving = false;

  async function makePayload() {
    return OS.crypto.isEnabled() ? await OS.crypto.encryptState(OS.state) : OS.state;
  }

  /**
   * Save the OS to disk.
   * opts.download: force the download path (used by "Download a copy").
   * Returns true on success, false on cancel/failure.
   */
  async function save(opts) {
    opts = opts || {};
    if (!OS.state || saving) return false;
    saving = true;
    OS.events.emit('saving', true);
    try {
      // Give the focused app a chance to commit its buffer (e.g. Notepad), so Ctrl+S "saves everything".
      if (!opts.download && OS.wm && OS.wm.focused && OS.wm.focused.onSaveShortcut) {
        try { await OS.wm.focused.onSaveShortcut(); } catch (e) { console.warn(e); }
      }
      var counterAtSave = OS.changeCounter;
      var prevSavedAt = OS.state.savedAt;
      OS.state.savedAt = now();
      var html = buildHTML(await makePayload());
      var blob = new Blob([html], { type: 'text/html' });

      var canFSA = !opts.download && typeof window.showSaveFilePicker === 'function'; // detect at save time
      if (canFSA) {
        try {
          if (!fileHandle) {
            fileHandle = await window.showSaveFilePicker({
              suggestedName: 'nimbus.html',
              types: [{ description: 'Nimbus file', accept: { 'text/html': ['.html', '.htm'] } }]
            });
          }
          var w = await fileHandle.createWritable();
          await w.write(blob);
          await w.close();
          finish(counterAtSave);
          OS.toast('Saved ' + fileHandle.name + ' (' + U.formatBytes(blob.size) + ')', 'ok');
          return true;
        } catch (err) {
          if (err && err.name === 'AbortError') {        // the user pressed Cancel: do nothing
            OS.state.savedAt = prevSavedAt;
            OS.toast('Save cancelled');
            return false;
          }
          console.warn('File System Access save failed, falling back to download:', err);
          fileHandle = null;
          OS.notice('<b>Could not write the file directly</b> (' + U.escapeHtml((err && (err.name + ': ' + err.message)) || 'unknown error') +
            '). Your browser may block this feature. A copy is being downloaded instead.', { key: 'fsa-fail' });
        }
      }
      U.downloadBlob(blob, 'nimbus.html');
      finish(counterAtSave);
      OS.toast('Downloaded nimbus.html (' + U.formatBytes(blob.size) + ')', 'ok');
      if (!opts.download && !OS.state.settings.fallbackNoticeDismissed) showFallbackNotice();
      return true;
    } catch (err) {
      console.error(err);
      OS.dialogs.alert('Saving failed: ' + err.message, { title: 'Save error' });
      return false;
    } finally {
      saving = false;
      OS.events.emit('saving', false);
    }
  }
  function finish(counterAtSave) {
    // Only clear dirty if nothing changed while we were writing.
    if (OS.changeCounter === counterAtSave) OS.clearDirty();
    backup.lastCounter = OS.changeCounter;
    OS.events.emit('saved');
  }

  var fallbackShown = false;
  function showFallbackNotice() {
    if (fallbackShown) return;
    fallbackShown = true;
    OS.notice('<b>Your browser saved a new copy.</b> This browser cannot overwrite the open file, so it downloaded <i>nimbus.html</i>. ' +
      'Replace your old file with the downloaded one (for example, copy it back to your USB stick). Your old file was not changed.',
      { dontShowAgain: function () { if (OS.state) OS.state.settings.fallbackNoticeDismissed = true; } });
  }

  function hasFSA() { return typeof window.showSaveFilePicker === 'function'; }
  function forgetHandle() { fileHandle = null; }

  /* --------------------- crash-recovery backup --------------------- */
  var LS_PREFIX = 'nimbus-backup:';
  var backup = {
    lastCounter: 0,
    timer: null,

    start: function () {
      if (this.timer) return;
      var self = this;
      this.timer = setInterval(function () { self.tick(); }, 30000);
    },
    tick: async function () {
      if (!OS.state || !OS.dirty || OS.changeCounter === this.lastCounter) return;
      var c = OS.changeCounter;
      try { await this.write(); this.lastCounter = c; } catch (e) { console.warn('Backup failed:', e); }
    },
    /** Write a backup now. Encrypted when a password is set; never plaintext then. */
    write: async function () {
      if (!OS.state) return;
      var rec = { fileId: OS.state.fileId, backupAt: now() };
      if (OS.crypto.isEnabled()) rec.envelope = await OS.crypto.encryptState(OS.state);
      else rec.data = OS.state;
      var str = JSON.stringify(rec);
      var key = LS_PREFIX + OS.state.fileId;
      var ok = false;
      try { localStorage.setItem(key, str); ok = true; } catch (e) { /* quota or disabled */ }
      if (ok) { await idb.del(key).catch(function () {}); return; }
      await idb.set(key, str);  // larger quota
      try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
    },
    read: async function (fileId) {
      var key = LS_PREFIX + fileId, recs = [];
      try { var s = localStorage.getItem(key); if (s) recs.push(JSON.parse(s)); } catch (e) { /* ignore */ }
      try { var s2 = await idb.get(key); if (s2) recs.push(JSON.parse(s2)); } catch (e) { /* ignore */ }
      recs = recs.filter(function (r) { return r && r.fileId === fileId; });
      recs.sort(function (a, b) { return b.backupAt - a.backupAt; });
      return recs[0] || null;
    },
    remove: async function (fileId) {
      var key = LS_PREFIX + fileId;
      try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
      await idb.del(key).catch(function () {});
    }
  };

  /* minimal IndexedDB key/value wrapper (only used if localStorage is full or blocked) */
  var idb = (function () {
    var dbp = null;
    function db() {
      if (!dbp) dbp = new Promise(function (res, rej) {
        if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
        var r;
        try { r = indexedDB.open('nimbus-backup', 1); } catch (e) { return rej(e); }
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
      return dbp;
    }
    function op(mode, fn) {
      return db().then(function (d) {
        return new Promise(function (res, rej) {
          var tx = d.transaction('kv', mode), st = tx.objectStore('kv'), req = fn(st);
          tx.oncomplete = function () { res(req && req.result); };
          tx.onerror = function () { rej(tx.error); };
        });
      });
    }
    return {
      get: function (k) { return op('readonly', function (s) { return s.get(k); }); },
      set: function (k, v) { return op('readwrite', function (s) { return s.put(v, k); }); },
      del: function (k) { return op('readwrite', function (s) { return s.delete(k); }); }
    };
  })();

  OS.storage = {
    SCHEMA_VERSION: SCHEMA_VERSION, APP_NAME: APP_NAME, defaultData: defaultData, defaultSettings: defaultSettings, DEFAULT_INSTALLED: DEFAULT_INSTALLED, migrate: migrate, readEmbedded: readEmbedded,
    escapeJSON: escapeJSON, buildHTML: buildHTML, dataSize: dataSize, save: save, hasFSA: hasFSA,
    forgetHandle: forgetHandle, backup: backup, makePayload: makePayload
  };
})();

/* ---- src/core/05-crypto.js ---- */
/* =====================================================================
   CORE 4: CRYPTO (optional password)
   PBKDF2-SHA-256 (600,000 iterations, 16-byte random salt) -> AES-GCM-256.
   A fresh random 12-byte IV is used for every encryption.
   The derived CryptoKey is non-extractable and lives only in memory.
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util;
  var ITERATIONS = 600000;

  var subtle = (window.crypto && window.crypto.subtle) || null;
  var available = !!(subtle && window.crypto.getRandomValues && window.isSecureContext !== false);
  var unavailableReason = available ? '' :
    'Your browser does not provide the Web Crypto API on this page' +
    (window.isSecureContext === false ? ' (the page is not treated as a secure context)' : '') +
    ', so password protection is disabled. Your data is stored unencrypted.';

  var current = null; // { key: CryptoKey, salt: Uint8Array, iterations }

  function rand(n) { var b = new Uint8Array(n); crypto.getRandomValues(b); return b; }

  async function deriveKey(password, salt, iterations) {
    var base = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  async function encryptWith(keyInfo, obj, fileId) {
    var iv = rand(12);
    var plain = new TextEncoder().encode(JSON.stringify(obj));
    var ct = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv: iv }, keyInfo.key, plain));
    return {
      version: OS.storage.SCHEMA_VERSION, fileId: fileId, encrypted: true,
      salt: U.bytesToB64(keyInfo.salt), iv: U.bytesToB64(iv), iterations: keyInfo.iterations,
      ciphertext: U.bytesToB64(ct)
    };
  }

  async function decryptWith(key, env) {
    var pt = await subtle.decrypt({ name: 'AES-GCM', iv: U.b64ToBytes(env.iv) }, key, U.b64ToBytes(env.ciphertext));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  OS.crypto = {
    ITERATIONS: ITERATIONS,
    available: available,
    unavailableReason: unavailableReason,
    isEnabled: function () { return !!current; },

    /** Set or change the password (derives a new key with a new salt). */
    setPassword: async function (password) {
      if (!available) throw new Error(unavailableReason);
      var salt = rand(16);
      current = { key: await deriveKey(password, salt, ITERATIONS), salt: salt, iterations: ITERATIONS };
    },
    removePassword: function () { current = null; },
    /** Forget the key (used by Lock now). */
    forgetKey: function () { current = null; },

    /** Check a password against the in-memory key without exposing it. */
    verify: async function (password) {
      if (!current) return false;
      var k = await deriveKey(password, current.salt, current.iterations);
      var probe = await encryptWith(current, { probe: 1 }, '');
      try { await decryptWith(k, probe); return true; } catch (e) { return false; }
    },

    /** Encrypt the whole state into an envelope (the only thing stored when a password is set). */
    encryptState: function (state) {
      if (!current) throw new Error('No password set');
      return encryptWith(current, state, state.fileId);
    },

    /**
     * Decrypt an envelope with a password. On success the derived key becomes the active key.
     * Throws { wrongPassword: true } if AES-GCM authentication fails.
     */
    unlock: async function (env, password, opts) {
      if (!available) throw new Error(unavailableReason);
      var salt = U.b64ToBytes(env.salt), it = env.iterations || ITERATIONS;
      var key = await deriveKey(password, salt, it);
      var data;
      try { data = await decryptWith(key, env); }
      catch (e) { var err = new Error('Wrong password'); err.wrongPassword = true; throw err; }
      if (!opts || !opts.dontActivate) current = { key: key, salt: salt, iterations: it };
      return data;
    },

    /** Decrypt using the active key if the salt matches (used for backups). */
    tryActiveKey: async function (env) {
      if (!current || U.bytesToB64(current.salt) !== env.salt) return null;
      try { return await decryptWith(current.key, env); } catch (e) { return null; }
    }
  };
})();

/* ---- src/core/06-vfs.js ---- */
/* =====================================================================
   CORE 6: VIRTUAL FILE SYSTEM
   The ONLY code allowed to touch OS.state.vfs. Apps and the terminal
   use this API. Nodes:
     folder: { id, name, type:'folder', parent, created, modified, children:[ids] }
     file:   { id, name, type:'file', parent, created, modified,
               encoding:'text'|'base64', mime, content }
   Optional: hidden (not listed), trashed: { from, name, at } (in Trash).
   Well-known folders live in vfs.special (desktop, documents, pictures,
   music, trash); they cannot be renamed, moved or deleted.
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util;
  var events = new U.Emitter();

  function T() { if (!OS.state) throw new Error('File system is locked'); return OS.state.vfs; }
  function N(id) { var n = T().nodes[id]; if (!n) throw new Error('No such file or folder'); return n; }
  function changed(kind, id) { OS.markDirty(); events.emit('change', { kind: kind, id: id }); }
  function touch(n) { n.modified = Date.now(); }

  var MIME = {
    txt: 'text/plain', md: 'text/markdown', json: 'application/json', csv: 'text/csv', log: 'text/plain',
    html: 'text/html', htm: 'text/html', css: 'text/css', js: 'text/javascript', xml: 'application/xml', svg: 'image/svg+xml',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp',
    pdf: 'application/pdf', zip: 'application/zip', mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', m4a: 'audio/mp4',
    flac: 'audio/flac', aac: 'audio/aac', opus: 'audio/ogg', mp4: 'video/mp4', webm: 'video/webm'
  };
  var TEXT_EXT = ['txt', 'md', 'json', 'csv', 'log', 'html', 'htm', 'css', 'js', 'xml', 'svg', 'ini', 'yml', 'yaml', 'py', 'sh'];

  function guessMime(name) { return MIME[U.extOf(name)] || 'application/octet-stream'; }
  function isTextLike(name, mime) {
    return TEXT_EXT.indexOf(U.extOf(name)) >= 0 || /^text\//.test(mime || '') || /json|xml|javascript/.test(mime || '');
  }

  /** Validate a file/folder name. Returns an error string, or '' if valid. */
  function nameError(name) {
    if (typeof name !== 'string' || !name.trim()) return 'Name cannot be empty.';
    if (name !== name.trim()) return 'Name cannot start or end with spaces.';
    if (name.indexOf('/') >= 0) return 'Name cannot contain "/".';
    if (name === '.' || name === '..') return 'That name is reserved.';
    if (/[\u0000-\u001f]/.test(name)) return 'Name contains invalid characters.';
    if (name.length > 255) return 'Name is too long.';
    return '';
  }
  function findChild(parentId, name, exceptId) {
    var p = N(parentId), lower = name.toLowerCase();
    if (p.type !== 'folder') return null;
    for (var i = 0; i < p.children.length; i++) {
      var c = T().nodes[p.children[i]];
      if (c && c.id !== exceptId && c.name.toLowerCase() === lower) return c.id;
    }
    return null;
  }

/* =====================================================================

/* =====================================================================
   APP: TO-DO LIST (state stored in data.apps.todo)
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util, h = U.h;

  OS.registerApp({
    id: 'todo',

    icon: OS.appIcons.todo,
    optional: true,
    category: 'Productivity',
    description: 'A simple, satisfying checklist. Drag to reorder, double-click to edit.',
    keywords: 'tasks checklist todo',
    defaultSize: { w: 460, h: 560 },
    singleInstance: true,
    launch: function (win) {
      function items() { return win.getState({ items: [] }).items; }
      function commit(list) { win.setState({ items: list }); render(); }

      var input = h('input', { class: 'input', type: 'text', placeholder: 'Add a task and press Enter', 'aria-label': 'New task', maxlength: '500' });
      var addBtn = h('button', { class: 'btn primary', type: 'button', title: 'Add', 'aria-label': 'Add task', html: OS.icons.plus });
      var list = h('ul', { class: 'td-list' });
      var footer = h('div', { class: 'td-footer' });
      win.body.classList.add('app-todo');
      win.body.append(h('div', { class: 'td-head' }, h('h2', null, 'My tasks'), h('form', { class: 'td-add', onsubmit: function (e) { e.preventDefault(); add(); } }, input, addBtn)), list, footer);
      addBtn.addEventListener('click', add);

      function add() {

      function remove(id) { commit(items().filter(function (it) { return it.id !== id; })); }

        var l = items().slice(), i = l.findIndex(function (x) { return x.id === id; }), j = i + d;
        if (i < 0 || j < 0 || j >= l.length) return;
        var t = l[i]; l[i] = l[j]; l[j] = t; commit(l);
        var b = list.querySelector('[data-id="' + id + '"] .td-' + (d < 0 ? 'up' : 'down')); if (b) b.focus();
      }
      function edit(li, it) {
        var ed = h('input', { class: 'input td-edit', type: 'text', maxlength: '500' }); ed.value = it.text;
        var txt = li.querySelector('.td-text'); txt.replaceWith(ed); ed.focus(); ed.select();
        var finished = false;
        function done(save) {
          if (finished) return; finished = true;
          var v = ed.value.trim();
          if (save && v && v !== it.text) update(it.id, { text: v }); else render();
        }
        ed.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); done(true); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); } });

        list.textContent = '';

/* =====================================================================
   APP: CALCULATOR (own expression parser, no eval)
   Grammar (precedence low -> high):
     expr    := term (('+' | '-') term)*
     term    := unary (('*' | '/') unary | implicit '(' unary)*
     unary   := ('-' | '+') unary | power
     power   := postfix ('^' unary)?          (right-associative, -2^2 = -4)
     postfix := primary '%'*                  (50% = 0.5)

      setTimeout(function () { win.body.focus(); }, 0);
    }
  });
})();

/* =====================================================================

   ===================================================================== */
(function () {
  'use strict';

  /** Split a command line into words, honoring quotes and backslash escapes. ">" and ">>" are separate tokens. */
  function parse(line) {
    var out = [], cur = '', q = null, has = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (q) {
        if (c === q) q = null;
        else if (c === '\\' && q === '"' && i + 1 < line.length) cur += line[++i];
        else cur += c;
        continue;
      }
      if (c === '"' || c === "'") { q = c; has = true; continue; }
      if (c === '\\' && i + 1 < line.length) { cur += line[++i]; has = true; continue; }
      if (/\s/.test(c)) { if (has) { out.push(cur); cur = ''; has = false; } continue; }
      if (c === '>') {
        if (has) { out.push(cur); cur = ''; has = false; }
        if (line[i + 1] === '>') { out.push({ op: '>>' }); i++; } else out.push({ op: '>' });
        continue;
      }
      cur += c; has = true;
    }
    if (q) throw new Error('Missing closing quote');
    if (has) out.push(cur);
    return out;
  }

  OS.registerApp({
    id: 'terminal',
    name: 'Terminal',
    icon: OS.appIcons.terminal,
    optional: true,
    category: 'Utilities',
    description: 'A command line for your files: ls, cd, cat, cp, mv, rm, find, tree and more.',
    keywords: 'shell command line console',
    defaultSize: { w: 720, h: 440 },
    launch: function (win, args) {

      var promptEl = h('span', { class: 'term-prompt' });
      var input = h('input', { class: 'term-in', type: 'text', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', 'aria-label': 'Command' });
      var line = h('div', { class: 'term-line' }, promptEl, input);
      var scroller = h('div', { class: 'term' }, out, line);
      win.body.classList.add('app-terminal');
      win.body.append(scroller);
      scroller.addEventListener('pointerup', function () { if (!getSelection().toString()) input.focus(); });

      function cwdPath() { if (!vfs.exists(cwd)) cwd = vfs.root(); return vfs.pathOf(cwd); }
      function user() { return ((OS.state.settings.userName || 'you').toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'you'); }

      function print(text, cls) { out.appendChild(h('div', { class: 'term-row' + (cls ? ' ' + cls : '') }, text)); }
      function err(text) { print(text, 'err'); }
      function need(path, what) {
        var id = vfs.resolvePath(path, cwd);
        if (!id) throw new Error(what + ': ' + path + ': No such file or folder');
        return id;
      }

      var commands = {
        help: { usage: 'help', desc: 'show this help', run: function () {
          Object.keys(commands).forEach(function (k) { print(commands[k].usage.padEnd(24) + commands[k].desc); });
          print('Paths: absolute (/Documents/a.txt) or relative (../a.txt). Use quotes for names with spaces. Up/Down: history. Tab: complete.', 'muted');
        } },
        ls: { usage: 'ls [-l] [path]', desc: 'list a folder', run: function (a) {
          var long = a[0] === '-l' || a[0] === '-la' || a[0] === '-al'; if (long) a = a.slice(1);
          var id = a.length ? need(a[0], 'ls') : cwd;
          var st = vfs.stat(id);
          var items = st.type === 'folder' ? vfs.list(id) : [st];
          if (!items.length) return;
          if (long) items.forEach(function (m) {
            print((m.type === 'folder' ? 'd ' : '- ') + U.formatBytes(m.size).padStart(9) + '  ' + new Date(m.modified).toLocaleString().padEnd(22) + '  ' + m.name + (m.type === 'folder' ? '/' : ''));
          });
          else print(items.map(function (m) { return m.name + (m.type === 'folder' ? '/' : ''); }).join('    '));
        } },
        cd: { usage: 'cd [path]', desc: 'change folder (cd .. goes up)', run: function (a) {
          var id = a.length ? need(a[0], 'cd') : vfs.root();
          if (!vfs.isFolder(id)) throw new Error('cd: ' + a[0] + ': Not a folder');
          cwd = id;
        } },
        pwd: { usage: 'pwd', desc: 'print current folder', run: function () { print(cwdPath()); } },
        cat: { usage: 'cat <file>...', desc: 'print file contents', run: function (a) {
          if (!a.length) throw new Error('cat: missing file');
          a.forEach(function (p) {
            var id = need(p, 'cat');
            if (vfs.isFolder(id)) throw new Error('cat: ' + p + ': Is a folder');
            var m = vfs.stat(id);
            if (m.encoding === 'base64' && !vfs.isTextLike(m.name, m.mime)) { print('[binary file, ' + U.formatBytes(m.size) + ', ' + m.mime + ']', 'muted'); return; }

        } },
        mkdir: { usage: 'mkdir [-p] <folder>...', desc: 'create folders', run: function (a) {
          var p = a[0] === '-p'; if (p) a = a.slice(1);
          if (!a.length) throw new Error('mkdir: missing folder name');
          a.forEach(function (path) {
            if (p) {
              var cur = path[0] === '/' ? vfs.root() : cwd;
              path.split('/').filter(Boolean).forEach(function (part) {
                if (part === '.') return;
                if (part === '..') { cur = vfs.stat(cur).parent || cur; return; }
                var ex = vfs.findChild(cur, part);
                if (ex) { if (!vfs.isFolder(ex)) throw new Error('mkdir: ' + part + ': exists and is not a folder'); cur = ex; }

            if (!r.parentId) throw new Error('mkdir: ' + path + ': parent folder does not exist');

        } },
        touch: { usage: 'touch <file>...', desc: 'create empty file / update time', run: function (a) {
          if (!a.length) throw new Error('touch: missing file name');
          a.forEach(function (path) {
            var id = vfs.resolvePath(path, cwd);
            if (id) { vfs.touch(id); return; }
            var r = vfs.resolveParent(path, cwd);
            if (!r.parentId) throw new Error('touch: ' + path + ': parent folder does not exist');
            vfs.createFile(r.parentId, r.name, '');
          });
        } },
        rm: { usage: 'rm [-r] <path>...', desc: 'delete files (-r for folders)', run: function (a) {
          var rec = false;
          a = a.filter(function (x) { if (/^-[rRf]+$/.test(x)) { if (/[rR]/.test(x)) rec = true; return false; } return true; });
          if (!a.length) throw new Error('rm: missing operand');
          a.forEach(function (p) {
            var id = need(p, 'rm');
            if (id === vfs.root()) throw new Error('rm: refusing to remove the root folder');
            if (vfs.isFolder(id) && !rec) throw new Error('rm: ' + p + ': is a folder (use rm -r)');
            if (vfs.isAncestor(id, cwd)) cwd = vfs.stat(id).parent;
            vfs.delete(id);
          });
        } },
        mv: { usage: 'mv <src> <dest>', desc: 'move or rename', run: function (a) {
          if (a.length !== 2) throw new Error('mv: usage: mv <src> <dest>');
          var src = need(a[0], 'mv');
          var dest = vfs.resolvePath(a[1], cwd);
          if (dest && vfs.isFolder(dest)) { vfs.move(src, dest); return; }      // move into folder
          if (dest) throw new Error('mv: ' + a[1] + ': already exists');
          var r = vfs.resolveParent(a[1], cwd);
          if (!r.parentId) throw new Error('mv: ' + a[1] + ': folder does not exist');
          var e = vfs.nameError(r.name); if (e) throw new Error('mv: ' + e);
          if (r.parentId !== vfs.stat(src).parent) {
            if (vfs.isFolder(src) && vfs.isAncestor(src, r.parentId)) throw new Error('mv: cannot move a folder into itself');
            var oldName = vfs.stat(src).name;
            if (vfs.findChild(r.parentId, oldName) && oldName.toLowerCase() !== r.name.toLowerCase()) {
              throw new Error('mv: "' + oldName + '" already exists in the destination');
            }
            vfs.move(src, r.parentId);
          }
          vfs.rename(src, r.name);
        } },
        echo: { usage: 'echo <text> [> file|>> file]', desc: 'print text or write to a file', run: function (a, redir) {
          var text = a.join(' ');
          if (!redir) { print(text); return; }
          var id = vfs.resolvePath(redir.file, cwd);
          if (id && vfs.isFolder(id)) throw new Error('echo: ' + redir.file + ': Is a folder');
          if (id) { vfs.write(id, redir.op === '>>' ? vfs.readText(id) + text + '\n' : text + '\n', { encoding: 'text' }); return; }
          var r = vfs.resolveParent(redir.file, cwd);
          if (!r.parentId) throw new Error('echo: ' + redir.file + ': folder does not exist');
          vfs.createFile(r.parentId, r.name, text + '\n');
        } },
        open: { usage: 'open <path>', desc: 'open a file in its app', run: function (a) {
          if (!a.length) throw new Error('open: missing path');
          OS.openFile(need(a[0], 'open'));
        } },
        cp: { usage: 'cp [-r] <src> <dest>', desc: 'copy a file (-r for folders)', run: function (a) {
          var rec = a[0] === '-r' || a[0] === '-R'; if (rec) a = a.slice(1);
          if (a.length !== 2) throw new Error('cp: usage: cp [-r] <src> <dest>');
          var src = need(a[0], 'cp');
          if (vfs.isFolder(src) && !rec) throw new Error('cp: ' + a[0] + ': is a folder (use cp -r)');
          var dest = vfs.resolvePath(a[1], cwd);
          if (dest && vfs.isFolder(dest)) { vfs.copy(src, dest, vfs.findChild(dest, vfs.stat(src).name) ? undefined : vfs.stat(src).name); return; }

          if (!r.parentId) throw new Error('cp: ' + a[1] + ': folder does not exist');

        tree: { usage: 'tree [path]', desc: 'show a folder tree', run: function (a) {
          var id = a.length ? need(a[0], 'tree') : cwd, lines = [vfs.stat(id).name || '/'], count = 0;
          (function walk(fid, prefix) {

        } },
        find: { usage: 'find <text>', desc: 'find files by name', run: function (a) {
          if (!a.length) throw new Error('find: missing search text');
          var res = vfs.search(a.join(' '), 100);
          if (!res.length) { print('No matches.', 'muted'); return; }
          res.forEach(function (m) { print(m.path + (m.type === 'folder' ? '/' : '')); });

        whoami: { usage: 'whoami', desc: 'print your user name', run: function () { print(user()); } },
        date: { usage: 'date', desc: 'print the date and time', run: function () { print(new Date().toString()); } },
        history: { usage: 'history', desc: 'list previous commands', run: function () { history.forEach(function (c, i) { print(String(i + 1).padStart(4) + '  ' + c); }); } },
        about: { usage: 'about', desc: 'about this system', run: function () {
          print([OS.storage.APP_NAME + ' (data format v' + OS.state.version + ')',
            'User:      ' + user(),
            'Apps:      ' + OS.installedApps().length + ' installed',
            'Data:      ' + U.formatBytes(OS.storage.dataSize()),
            'Encrypted: ' + (OS.crypto.isEnabled() ? 'yes (AES-GCM)' : 'no')].join('\n'));
        } },
        clear: { usage: 'clear', desc: 'clear the screen', run: function () { out.textContent = ''; } }
      };

      function exec(lineText) {
        print(promptEl.textContent + lineText, 'cmd');
        var words;
        try { words = parse(lineText); } catch (e) { err(e.message); return; }
        if (!words.length) return;
        var redir = null, idx = words.findIndex(function (w) { return typeof w === 'object'; });
        if (idx >= 0) {
          var f = words[idx + 1];
          if (typeof f !== 'string') { err('syntax error: expected a file name after ' + words[idx].op); return; }
          redir = { op: words[idx].op, file: f };
          words = words.slice(0, idx).concat(words.slice(idx + 2));
          if (words.some(function (w) { return typeof w === 'object'; })) { err('syntax error: only one redirection is supported'); return; }
        }
        var name = words[0], cmd = commands[name];
        if (!cmd) { err(name + ': command not found (type "help")'); return; }
        if (redir && name !== 'echo') { err('redirection is only supported for echo'); return; }

        var v = input.value, pos = input.selectionStart;
        var before = v.slice(0, pos), m = /(\S*)$/.exec(before), word = m[1];

        if (first) cands = Object.keys(commands).filter(function (c) { return c.indexOf(word) === 0; });
        else {
          var slash = word.lastIndexOf('/'), dirPart = slash >= 0 ? word.slice(0, slash + 1) : '', base = slash >= 0 ? word.slice(slash + 1) : word;

          if (!dirId || !vfs.isFolder(dirId)) return;
          cands = vfs.list(dirId).filter(function (x) { return x.name.toLowerCase().indexOf(base.toLowerCase()) === 0; })
            .map(function (x) { return dirPart + x.name.replace(/ /g, '\\ ') + (x.type === 'folder' ? '/' : ''); });
        }
        if (cands.length === 1) {
          var ins = cands[0] + (first ? ' ' : '');
          input.value = before.slice(0, before.length - word.length) + ins + v.slice(pos);
          var np = before.length - word.length + ins.length; input.setSelectionRange(np, np);
        } else if (cands.length > 1) print(cands.join('    '), 'muted');
      }

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var v = input.value; input.value = '';
          if (v.trim()) { history.push(v); if (history.length > 200) history.shift(); }

        } else if (e.key === 'ArrowUp') {

        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (hIdx < history.length) { hIdx++; input.value = hIdx === history.length ? draft : history[hIdx]; }

        else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); out.textContent = ''; }
      });

      print(OS.storage.APP_NAME + ' terminal. Type "help" for a list of commands.', 'muted');
      updatePrompt();
      setTimeout(function () { input.focus(); }, 0);

    }
  });
})();

/* =====================================================================
   APP: STORE
   Install / uninstall the optional built-in apps, and install your own
   apps from a .js file ("sideloading").
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util, h = U.h;

  var EXAMPLE_APP = [
    '// A tiny Nimbus app. Install it from Store > Install from file.',
    '// Everything an app needs is one OS.registerApp() call.',
    'OS.registerApp({',
    "  id: 'hello-counter',",
    "  name: 'Counter',",
    "  icon: OS.makeAppIcon('#e0803a', '<circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"var(--ic-fg,#fff)\"/>'),",
    "  category: 'Utilities',",
    '  defaultSize: { w: 320, h: 220 },',
    '  launch: function (win) {',
    '    var h = OS.util.h;',
    '    var state = win.getState({ clicks: 0 });',
    "    var label = h('p', { style: { fontSize: '28px', textAlign: 'center' } }, String(state.clicks));",
    "    var btn = h('button', { class: 'btn primary' }, 'Add one');",
    "    btn.addEventListener('click', function () {",
    '      state.clicks++;',
    '      win.setState(state);            // saved inside the Nimbus file',
    '      label.textContent = String(state.clicks);',
    '    });',
    "    win.body.style.alignItems = 'center';",
    "    win.body.style.justifyContent = 'center';",
    '    win.body.append(label, btn);',
    '  }',
    '});',
    ''
  ].join('\n');

  function optionalApps() {
    var out = [];
    OS.apps.forEach(function (a) { if (a.optional && !a.hidden) out.push(a); });
    return out.sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  /** Install a sideloaded app from source code. Throws on failure. */
  function sideload(code, fileName) {
    var before = new Set(OS.apps.keys()), error = null;
    var onErr = function (e) { error = e.error || new Error(e.message); };
    window.addEventListener('error', onErr);
    var el = document.createElement('script');
    el.textContent = code + '\n//# sourceURL=' + encodeURIComponent(fileName || 'sideloaded-app.js');
    document.body.appendChild(el); el.remove();
    window.removeEventListener('error', onErr);
    var added = [];
    OS.apps.forEach(function (a, id) { if (!before.has(id)) added.push(a); });
    if (error) { added.forEach(function (a) { OS.apps.delete(a.id); }); throw new Error('The app crashed while installing: ' + error.message); }

  }

    OS.state.sideloaded = OS.state.sideloaded.filter(function (p) { return p.id !== id; });
    var st = OS.state.settings;
    st.shelf = st.shelf.filter(function (x) { return x !== id; });
    st.desktopApps = st.desktopApps.filter(function (x) { return x !== id; });
    OS.apps.delete(id);
    OS.markDirty();
    OS.events.emit('apps-changed');
    return true;
  }

  OS.registerApp({
    id: 'store',
    name: 'Store',
    icon: OS.appIcons.store,
    category: 'System',
    keywords: 'install apps games download',
    defaultSize: { w: 920, h: 620 },
    singleInstance: true,
    launch: function (win, args) {
      var tab = args.tab || 'discover', detail = null, busy = {};

        cells.push(c); gridEl.appendChild(c);
      }
      for (var n = 1; n <= 9; n++) pad.appendChild(h('button', { class: 'sd-num', type: 'button', dataset: { n: String(n) }, onclick: (function (k) { return function () { input(k); win.body.focus(); }; })(n) }, h('b', null, String(n)), h('small')));

      function newGame(level) {
        save.level = level;
        info.textContent = 'Generating…';
        setTimeout(function () {
          var p = generate(level);
          save.game = { puzzle: p.puzzle, solution: p.solution, values: p.puzzle.slice(), notes: new Array(81).fill(0), time: 0, done: false, hints: 0, filled: 0, mistakes: 0 };
          sel = p.puzzle.indexOf(0);
          startClock(); render();
        }, 10);
      }
      function startClock() {
        clearInterval(timer);
        timer = setInterval(function () { if (save.game && !save.game.done && OS.wm.focused === win) { save.game.time++; updInfo(); } }, 1000);
      }
      function updInfo() {
        var g = save.game; if (!g) return;
        var t = g.time;
        info.textContent = LEVELS[save.level].name + ' · ' + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') + (g.mistakes ? ' · ' + g.mistakes + ' mistake' + (g.mistakes > 1 ? 's' : '') : '');
      }
      function input(n) {
        var g = save.game; if (!g || g.done || sel < 0 || g.puzzle[sel]) return;
        if (notesMode && n) {
          if (g.values[sel]) return;
          g.notes[sel] ^= 1 << n;
        } else {
          if (n && g.values[sel] === n) n = 0;           // tapping the same number clears it
          g.values[sel] = n; g.notes[sel] = 0;
          if (n) {
            g.filled++;
            if (n !== g.solution[sel]) { g.mistakes++; if (save.showErrors) OS.sound.play('error'); }
            else {
              // clear this number from notes in the same row, column and box
              var r = Math.floor(sel / 9), c = sel % 9, b = boxOf(sel);
              for (var k = 0; k < 81; k++) if (Math.floor(k / 9) === r || k % 9 === c || boxOf(k) === b) g.notes[k] &= ~(1 << n);
              OS.sound.play('click');
            }
          }
        }
        render(); checkWin();
      }
      function hint() {
        var g = save.game; if (!g || g.done) return;
        var target = sel >= 0 && !g.puzzle[sel] && g.values[sel] !== g.solution[sel] ? sel : -1;
        if (target < 0) { var empties = []; for (var i = 0; i < 81; i++) if (g.values[i] !== g.solution[i]) empties.push(i); if (!empties.length) return; target = empties[Math.floor(Math.random() * empties.length)]; }
        g.values[target] = g.solution[target]; g.notes[target] = 0; g.hints++; g.puzzle[target] = g.solution[target];   // hinted cells become fixed
        sel = target; OS.sound.play('pop'); render(); checkWin();
      }
      function checkWin() {
        var g = save.game;
        if (!g || g.done) return;
        for (var i = 0; i < 81; i++) if (g.values[i] !== g.solution[i]) return;
        g.done = true; save.wins[save.level] = (save.wins[save.level] || 0) + 1;
        win.setState(save);
        gridEl.classList.add('solved'); OS.sound.play('win');
        setTimeout(function () {
          OS.dialogs.modal({ title: 'Solved!', icon: 'trophy', body: LEVELS[save.level].name + ' puzzle in ' + Math.floor(g.time / 60) + ' min ' + g.time % 60 + ' s' + (g.hints ? ' with ' + g.hints + ' hint' + (g.hints > 1 ? 's' : '') : '') + '.\nPuzzles solved at this level: ' + save.wins[save.level],
            buttons: [{ label: 'Close', value: null }, { label: 'Next puzzle', value: 'new', primary: true }] }).then(function (v) { if (v === 'new') newGame(save.level); });
        }, 600);
      }
      function render() {
        var g = save.game; if (!g || win.closed) return;
        levelSeg.querySelectorAll('.seg-btn').forEach(function (b) { b.classList.toggle('on', b.dataset.level === save.level); });
        bNotes.classList.toggle('on', notesMode); bErr.classList.toggle('on', save.showErrors);
        gridEl.classList.toggle('solved', g.done);
        var sv = sel >= 0 ? g.values[sel] : 0, sr = Math.floor(sel / 9), sc = sel % 9, sb = sel >= 0 ? boxOf(sel) : -1;
        cells.forEach(function (c, i) {
          var v = g.values[i];
          c.className = 'sd-cell' + (i % 9 === 2 || i % 9 === 5 ? ' br' : '') + (Math.floor(i / 9) === 2 || Math.floor(i / 9) === 5 ? ' bb' : '') +
            (g.puzzle[i] ? ' given' : '') + (i === sel ? ' sel' : '') +
            (sel >= 0 && i !== sel && (Math.floor(i / 9) === sr || i % 9 === sc || boxOf(i) === sb) ? ' peer' : '') +
            (sv && v === sv && i !== sel ? ' same' : '') +
            (save.showErrors && v && !g.puzzle[i] && v !== g.solution[i] ? ' wrong' : '');
          c.textContent = '';
          if (v) c.textContent = String(v);
          else if (g.notes[i]) {
            var nb = h('span', { class: 'sd-notes' });
            for (var n = 1; n <= 9; n++) nb.appendChild(h('i', null, g.notes[i] & (1 << n) ? String(n) : ''));
            c.appendChild(nb);
          }
          c.setAttribute('aria-label', 'Row ' + (Math.floor(i / 9) + 1) + ' column ' + (i % 9 + 1) + (v ? ', ' + v : ', empty'));
        });
        renderPad(); updInfo();
      }
      function renderPad() {
        var g = save.game; if (!g) return;
        bNotes.classList.toggle('on', notesMode);
        pad.classList.toggle('notes', notesMode);
        pad.querySelectorAll('.sd-num').forEach(function (b) {
          var n = +b.dataset.n, left = 9;
          g.values.forEach(function (v, i) { if (v === n && v === g.solution[i]) left--; });
          b.querySelector('small').textContent = left > 0 ? String(left) : '';
          b.disabled = left <= 0;
        });
      }
      win.body.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === 'INPUT') return;
        var k = e.key;
        if (/^[1-9]$/.test(k)) { e.preventDefault(); input(+k); }
        else if (k === 'Backspace' || k === 'Delete' || k === '0') { e.preventDefault(); input(0); }
        else if (k === 'n' || k === 'N') { e.preventDefault(); notesMode = !notesMode; renderPad(); }
        else if (k.indexOf('Arrow') === 0) {
          e.preventDefault();
          if (sel < 0) sel = 0;
          var r = Math.floor(sel / 9), c = sel % 9;
          if (k === 'ArrowUp') r = (r + 8) % 9; else if (k === 'ArrowDown') r = (r + 1) % 9; else if (k === 'ArrowLeft') c = (c + 8) % 9; else c = (c + 1) % 9;
          sel = r * 9 + c; render();
        }
      });
      // fit the board to the window (width and height)
      var boardWrap = gridEl.parentNode;
      function fit() {
        var w = win.body.clientWidth - 32, hh = win.body.clientHeight - 210;
        var size = Math.max(220, Math.min(540, w, hh));
        boardWrap.style.width = size + 'px'; pad.style.width = size + 'px';
        win.body.querySelector('.sd-top').style.width = size + 'px';
      }
      if (window.ResizeObserver) { var ro = new ResizeObserver(fit); ro.observe(win.body); win.onDestroy(function () { ro.disconnect(); }); }
      fit();
      win.onDestroy(function () { clearInterval(timer); });
      if (save.game && !save.game.done) { sel = save.game.values.indexOf(0); startClock(); render(); }
      else newGame(save.level);
      setTimeout(function () { win.body.focus(); }, 0);
    }
  });
})();

/* =====================================================================
   EXAMPLE APP: how to add your own app
   ---------------------------------------------------------------------
   Three ways to add an app:
   1. Save the block below (without the comment markers) as a .js file
      and install it in Nimbus: Store > Install from file.
   2. Put it in src/apps/ and rebuild with "node build.js".
   3. Paste it at the end of the script in a built nimbus.html.
   The app appears in the launcher, can be pinned to the shelf or the
   desktop, gets windows, and (if fileTypes is set) opens those files.
   Set optional: true to make it installable from the Store instead.

   OS.registerApp({
     id: 'hello',                       // unique id (also the key for saved window size and app state)
     name: 'Hello',
     icon: OS.appIcons.generic,         // any inline <svg> string
     fileTypes: [],                     // e.g. ['csv'] to open .csv files from Files / Terminal "open"
     defaultSize: { w: 360, h: 240 },
     singleInstance: false,
     launch: function (win, args) {
       // win.body       : element to render into
       // win.setTitle() : change the title bar text
       // win.close()    : close the window
       // win.onClose(fn): fn may return false (or a Promise of false) to keep the window open
       // win.getState(defaults) / win.setState(obj): persistent per-app data (saved in the file)
       // win.vfs, win.dialogs, win.toast, win.markDirty()
       var count = win.getState({ clicks: 0 }).clicks;
       var label = OS.util.h('p', { style: { padding: '16px' } }, 'Clicked ' + count + ' times');
       var btn = OS.util.h('button', { class: 'btn primary', style: { margin: '0 16px' } }, 'Click me');
       btn.addEventListener('click', function () {
         count++;
         win.setState({ clicks: count });     // marks the OS as having unsaved changes
         label.textContent = 'Clicked ' + count + ' times';
       });
       win.body.append(label, btn);
     }
   });
   ===================================================================== */

/* ---- src/boot.js ---- */
/* =====================================================================
   BOOT: load data -> (unlock) -> (first-run setup) -> desktop -> backup check
   Runs after all apps have registered.
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util, h = U.h;

  function fatal(title, msg, actions) {
    var card = h('div', { class: 'setup-card' }, h('div', { class: 'setup-icon', html: OS.icons.warning }), h('h1', null, title), h('p', { class: 'setup-text' }, msg), actions || null);
    document.getElementById('os-root').appendChild(h('div', { class: 'screen setup' }, card));
  }

  async function checkBackup(password) {
    var st = OS.state, rec;
    try { rec = await OS.storage.backup.read(st.fileId); } catch (e) { return; }
    if (!rec || !(rec.backupAt > (st.savedAt || 0))) return;

    var restored = null, env = rec.envelope, pwForEnv = null;
    if (rec.data) restored = rec.data;
    else if (env) {
      restored = await OS.crypto.tryActiveKey(env);
      if (!restored && password) {
        try { restored = await OS.crypto.unlock(env, password, { dontActivate: true }); pwForEnv = password; } catch (e) { restored = null; }
      }
      while (!restored && OS.crypto.available) {
        var pw = await OS.dialogs.prompt('A crash-recovery backup from ' + new Date(rec.backupAt).toLocaleString() +
          ' was found, but it is encrypted with a different password. Enter that password to restore it, or cancel to ignore it.',
          { title: 'Recovery backup', type: 'password', okLabel: 'Decrypt' });
        if (pw == null) return;
        try { restored = await OS.crypto.unlock(env, pw, { dontActivate: true }); pwForEnv = pw; }
        catch (e) { OS.toast('Wrong password', 'error'); }
      }
    }
    if (!restored) return;

    var choice = await OS.dialogs.choose(
      'This browser has a crash-recovery backup from ' + new Date(rec.backupAt).toLocaleString() +
      ', which is newer than the data saved in this file' + (st.savedAt ? ' (' + new Date(st.savedAt).toLocaleString() + ')' : '') + '.\n' +
      'Restore it? If you ignore it, it will be overwritten the next time you make changes.',
      [{ label: 'Ignore', value: 'ignore' }, { label: 'Restore backup', value: 'restore', primary: true }],
      { title: 'Restore unsaved changes?' });
    if (choice !== 'restore') return;
    try {
      var data = OS.storage.migrate(restored);
      data.fileId = st.fileId;
      if (pwForEnv) await OS.crypto.unlock(env, pwForEnv);  // backup used a password: keep protecting the data with it
      await OS.wm.closeAll(true);
      OS.state = data;
      OS.apps.forEach(function (a, id) { if (a.sideloaded) OS.apps.delete(id); });
      loadSideloaded();
      OS.shell.showDesktop();
      OS.markDirty();
      OS.toast('Backup restored. Save to keep it in the file.', 'ok', 5000);
    } catch (e) {
      OS.dialogs.alert('The backup could not be restored: ' + e.message, { title: 'Recovery backup' });
    }
  }

  /** Run apps the user installed from a file (Store > Install from file). Errors never stop the boot. */
  function loadSideloaded() {
    (OS.state.sideloaded || []).forEach(function (pkg) {
      if (OS.apps.has(pkg.id)) return;
      try {
        var before = new Set(OS.apps.keys());
        var el = document.createElement('script');
        el.textContent = '(function(){try{' + pkg.code + '\n}catch(e){console.error("Sideloaded app failed:",e);}})();';
        document.body.appendChild(el); el.remove();     // the saved file is built from the pristine snapshot, so this never persists in the HTML
        OS.apps.forEach(function (a, id) { if (!before.has(id)) { a.sideloaded = true; a.optional = false; } });
      } catch (e) { console.error(e); }
    });
  }
  OS.loadSideloaded = loadSideloaded;

  async function boot() {
    OS.theme.applyDefault();
    OS.shell.mount();
    OS.shell.hideDesktop();
    var splash = OS.shell.splash();

    var raw;
    try { raw = OS.storage.readEmbedded(); }
    catch (e) {
      console.error(e);
      splash.done();
      fatal('This file is damaged', 'The data inside this file could not be read (' + e.message + '). Nothing has been changed. Open a backup copy of the file instead.',
        h('button', { class: 'btn tonal', type: 'button', onclick: function () { location.reload(); } }, 'Reload'));
      return;
    }

    var data, password = null;
    try {
      if (raw && raw.encrypted) {
        splash.done();
        var res = await OS.shell.lockScreen(raw);
        password = res.password;
        data = OS.storage.migrate(res.data);
        data.fileId = raw.fileId || data.fileId;
      } else if (raw) {
        data = OS.storage.migrate(raw);
      } else {
        data = OS.storage.defaultData();
      }
    } catch (e) {
      console.error(e);
      splash.done();
      fatal('Cannot open this file', e.message);
      return;
    }

    OS.state = data;
    loadSideloaded();
    await OS.theme.apply();
    OS.shell.showDesktop();
    splash.done();
    if (!data.setupDone) {
      await OS.setup.run();
      OS.notify('Welcome to ' + OS.storage.APP_NAME, 'Open the guide to learn the basics.', { icon: 'sparkle', sound: false,
        action: { label: 'Open guide', run: function () { var id = OS.vfs.resolvePath('/Documents/Welcome.md'); if (id) OS.launch('notepad', { fileId: id, preview: true }); } } });
    } else if (!password) {
      OS.sound.play('startup');   // may stay silent until the first click: browsers block audio before a gesture
    }
    OS.storage.backup.start();
    await checkBackup(password);
    password = null;
  }

  OS.boot = boot;
  if (!window.__OS_NO_AUTOBOOT__) boot().catch(function (e) { console.error(e); fatal('Startup failed', e.message); });
})();
