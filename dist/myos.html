<!DOCTYPE html>
<!--
=====================================================================
 MyOS: a portable, single-file web desktop
=====================================================================

 Double-click this file to open it in any modern browser (Chrome,
 Edge, Firefox, Safari). It needs no install, no internet and no
 special permissions. Everything (the OS, the apps and ALL of your
 files and settings) lives inside this one .html file.

 HOW SAVING WORKS
 * Chrome / Edge: the first time you save (Ctrl+S / Cmd+S, or the
   save button in the taskbar), a "Save as" dialog opens. Pick THIS
   file (myos.html) to overwrite it. For the rest of the session every
   save silently overwrites that same file with one keystroke. After
   you close the tab and reopen the file, the first save asks again.
 * Firefox / Safari, or Chrome/Edge with the File System Access API
   blocked by policy: each save downloads a complete new copy named
   myos.html (your browser may call it "myos (1).html"). Replace your
   old file with the new one, for example by copying it back onto your
   USB stick. The old file is never changed.
 * A dot on the save button means there are unsaved changes. The
   browser warns you if you try to close the tab with unsaved changes.

 CRASH RECOVERY BACKUP
 While you have unsaved changes, a backup is written to this browser's
 local storage every 30 seconds. If the tab crashes, reopen the same
 file on the SAME computer and browser and you will be offered the
 backup. The backup never leaves that computer, it is not part of the
 .html file, and if you use a password the backup is encrypted too.
 On a shared or school computer, a backup can stay behind in that
 browser profile. Use a password if that matters to you.

 PASSWORD
 You can set an optional password on first launch or later in
 Settings. With a password, all data inside the file is encrypted with
 AES-GCM using a key derived from your password (PBKDF2-SHA-256,
 600,000 iterations). Nothing readable is stored in the file.
 THERE IS NO PASSWORD RECOVERY. If you forget it, your data is gone.
 "Lock now" in the start menu drops the decrypted data from memory and
 returns to the lock screen.

 ADDING AN APP (for developers)
 Apps register through one call: OS.registerApp({ id, name, icon,
 fileTypes, defaultSize, singleInstance, launch(win, args) { ... } }).
 See the commented example app at the very end of the script, and the
 source tree (src/apps/*.js, built with "node build.js").

 KNOWN LIMITATIONS
 * The file grows with your data. Imported binary files are stored as
   base64, which is about 33% larger than the original. Very large
   files (hundreds of MB) will be slow to open and save.
 * Browser-reserved shortcuts (Ctrl+W, Ctrl+T, Ctrl+N, Ctrl+Tab...)
   belong to the browser and are not intercepted.
 * In Firefox/Safari every save creates a new download you must move
   into place yourself.
 * JavaScript cannot securely wipe memory. "Lock now" drops every
   reference to your decrypted data, and the browser frees it later.
 * Drag-and-drop between folders needs a mouse; on touch screens use
   the Move button instead.
=====================================================================
-->

/* ---- src/styles/10-base.css ---- */
/* =====================================================================
   BASE: theme tokens, reset, shared controls
   ===================================================================== */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 12px;
  --radius-sm: 7px;
  --taskbar-h: 48px;

  --accent: #4f66e8;
  --accent-hover: #4157d6;
  --accent-contrast: #ffffff;
  --accent-soft: rgba(79, 102, 232, .14);
  --danger: #d23f4c;
  --warn: #b97800;
  --ok: #23905a;

  --bg: #e9edf4;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --surface-3: #e9edf4;
  --text: #1b2130;
  --muted: #687185;
  --border: #dbe0ea;
  --border-strong: #c3cad8;
  --hover: rgba(35, 55, 110, .07);
  --selected: rgba(79, 102, 232, .16);
  --titlebar: #eef1f7;
  --titlebar-inactive: #f6f7fa;
  --taskbar: rgba(248, 249, 252, .86);
  --overlay: rgba(14, 18, 30, .38);
  --shadow: 0 18px 48px rgba(16, 24, 48, .22), 0 3px 10px rgba(16, 24, 48, .12);
  --shadow-inactive: 0 6px 18px rgba(16, 24, 48, .10), 0 1px 3px rgba(16, 24, 48, .08);
  --shadow-pop: 0 12px 32px rgba(16, 24, 48, .22);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --accent: #7b8cff;
  --accent-hover: #93a1ff;
  --accent-contrast: #0e1020;
  --accent-soft: rgba(123, 140, 255, .18);
  --danger: #ff6b76;
  --warn: #f0b43c;
  --ok: #4fcf8b;

  --bg: #12151c;
  --surface: #1c2029;
  --surface-2: #232834;
  --surface-3: #2b3140;
  --text: #e6e9f0;
  --muted: #98a0b3;
  --border: #323949;
  --border-strong: #454e62;
  --hover: rgba(255, 255, 255, .06);
  --selected: rgba(123, 140, 255, .22);
  --titlebar: #262b37;
  --titlebar-inactive: #1f232d;
  --taskbar: rgba(22, 25, 33, .86);
  --overlay: rgba(0, 0, 0, .55);
  --shadow: 0 18px 48px rgba(0, 0, 0, .55), 0 3px 10px rgba(0, 0, 0, .35);
  --shadow-inactive: 0 6px 18px rgba(0, 0, 0, .35);
  --shadow-pop: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  font-family: var(--font); font-size: 14px; color: var(--text);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
#os-root { position: fixed; inset: 0; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { display: block; }
[hidden] { display: none !important; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
  cursor: pointer; white-space: nowrap; user-select: none;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn:active { background: var(--surface-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .icon-btn:focus-visible, .input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger.primary { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn svg { width: 16px; height: 16px; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0;
  border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text);
  cursor: pointer;
}
.icon-btn:hover { background: var(--hover); }
.icon-btn.active { background: var(--selected); color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:disabled { opacity: .4; cursor: default; background: none; }

.input {
  min-height: 32px; padding: 5px 10px; width: 100%;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); outline: none;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.toolbar {
  display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--surface-2);
}
.toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
.toolbar .grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }

/* scrollbars (where supported) */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ---- src/styles/20-shell.css ---- */
/* =====================================================================
   SHELL: desktop, icons, taskbar, start menu, windows, dialogs, toasts
   ===================================================================== */

/* ---- desktop ---- */
#desktop {
  position: absolute; inset: 0 0 var(--taskbar-h) 0;
  background: linear-gradient(135deg, #5b6cf0, #9a5fe0);
  background-size: cover; background-position: center;
}
#desktop-icons {
  position: absolute; inset: 0; padding: 12px;
  display: grid; grid-auto-flow: column;
  grid-template-rows: repeat(auto-fill, 96px); grid-auto-columns: 92px;
  gap: 4px; align-content: start; justify-content: start;
  overflow: hidden;
}
.desk-icon {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: 88px; height: 92px; padding: 8px 4px;
  border: 1px solid transparent; border-radius: 10px; background: none;
  color: #fff; cursor: default; user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.desk-icon .ico { width: 44px; height: 44px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
.desk-icon .ico svg { width: 44px; height: 44px; }
.desk-icon span {
  font-size: 12px; line-height: 1.25; text-align: center;
  text-shadow: 0 1px 3px rgba(0,0,0,.6); word-break: break-word;
}
.desk-icon:hover { background: rgba(255,255,255,.12); }
.desk-icon:focus { outline: none; }
.desk-icon.selected, .desk-icon:focus-visible { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.4); }
#desktop.drop-target::after {
  content: "Drop files to import them"; position: absolute; inset: 16px;
  border: 3px dashed rgba(255,255,255,.8); border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 20px; text-shadow: 0 1px 4px rgba(0,0,0,.5);
  background: rgba(0,0,0,.15); pointer-events: none;
}

/* ---- taskbar ---- */
#taskbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--taskbar-h);
  display: flex; align-items: center; gap: 6px; padding: 0 6px;
  background: var(--taskbar); border-top: 1px solid var(--border);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  z-index: 100000; user-select: none; -webkit-user-select: none;
}
.tb-btn {
  height: 38px; min-width: 38px; padding: 0 10px; display: inline-flex; align-items: center; gap: 8px;
  border: 0; border-radius: 9px; background: transparent; color: var(--text); cursor: pointer;
  position: relative; flex-shrink: 0;
}
.tb-btn:hover { background: var(--hover); }
.tb-btn svg { width: 20px; height: 20px; }
#start-btn svg { width: 24px; height: 24px; }
#start-btn.open { background: var(--selected); }
#task-buttons { flex: 1; display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; min-width: 0; scrollbar-width: none; }
#task-buttons::-webkit-scrollbar { display: none; }
.task-btn {
  height: 38px; max-width: 200px; min-width: 44px; padding: 0 10px;
  display: inline-flex; align-items: center; gap: 8px; flex-shrink: 1;
  border: 0; border-radius: 9px; background: transparent; color: var(--text); cursor: pointer;
  position: relative;
}
.task-btn .ico svg { width: 20px; height: 20px; }
.task-btn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.task-btn:hover { background: var(--hover); }
.task-btn::after {
  content: ""; position: absolute; left: 50%; bottom: 3px; width: 6px; height: 3px;
  border-radius: 2px; background: var(--muted); transform: translateX(-50%); transition: width .15s;
}
.task-btn.focused { background: var(--selected); }
.task-btn.focused::after { width: 18px; background: var(--accent); }
.task-btn.minimized { opacity: .7; }
@media (max-width: 700px) { .task-btn .lbl { display: none; } }

#tray { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
#size-ind { font-size: 12px; color: var(--muted); padding: 0 8px; }
#size-ind.warn { color: var(--warn); font-weight: 600; }
#save-btn .dot {
  position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--warn); border: 2px solid var(--taskbar); display: none;
}
#save-btn.dirty .dot { display: block; }
#clock { font-size: 13px; padding: 0 8px; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.15; }
#clock small { display: block; font-size: 11px; color: var(--muted); }
@media (max-width: 520px) { #size-ind { display: none; } #clock small { display: none; } }

/* ---- start menu ---- */
#start-menu {
  position: absolute; left: 8px; bottom: calc(var(--taskbar-h) + 8px);
  width: min(360px, calc(100vw - 16px)); max-height: calc(100% - var(--taskbar-h) - 16px);
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow-pop); z-index: 100001; overflow: hidden;
  animation: pop .14s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.sm-head { padding: 14px 16px 6px; font-weight: 600; }
.sm-apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 4px; padding: 6px 10px 10px; overflow: auto; }
.sm-app {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px;
  border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-size: 12px; text-align: center;
}
.sm-app:hover, .sm-app:focus-visible { background: var(--hover); outline: none; }
.sm-app svg { width: 36px; height: 36px; }
.sm-actions { border-top: 1px solid var(--border); padding: 6px; display: flex; flex-direction: column; background: var(--surface-2); }
.sm-action {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px;
  background: transparent; cursor: pointer; text-align: left;
}
.sm-action:hover, .sm-action:focus-visible { background: var(--hover); outline: none; }
.sm-action svg { width: 18px; height: 18px; color: var(--muted); }
.sm-action:disabled { opacity: .45; cursor: default; background: none; }
.sm-action .hint { margin-left: auto; font-size: 12px; color: var(--muted); }

/* ---- windows ---- */
#windows { position: absolute; inset: 0 0 var(--taskbar-h) 0; pointer-events: none; }
.win {
  position: absolute; display: flex; flex-direction: column;
  min-width: 160px; min-height: 100px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-inactive); pointer-events: auto;
  animation: win-open .14s ease-out;
}
@keyframes win-open { from { opacity: 0; transform: scale(.97); } }
.win.focused { box-shadow: var(--shadow); border-color: var(--border-strong); }
.win.maximized { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; border-width: 0; }
.win.minimized { display: none; }
.win-titlebar {
  height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 12px;
  background: var(--titlebar-inactive); border-bottom: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
  user-select: none; -webkit-user-select: none; touch-action: none; cursor: default;
}
.win.maximized .win-titlebar { border-radius: 0; }
.win.focused .win-titlebar { background: var(--titlebar); }
.win-titlebar .ico svg { width: 18px; height: 18px; }
.win-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted); }
.win.focused .win-title { color: var(--text); font-weight: 600; }
.win-ctrls { display: flex; gap: 2px; }
.win-ctrl { width: 34px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.win.focused .win-ctrl { color: var(--text); }
.win-ctrl:hover { background: var(--hover); }
.win-ctrl.close:hover { background: var(--danger); color: #fff; }
.win-ctrl svg { width: 14px; height: 14px; }
.win-body { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; border-radius: 0 0 var(--radius) var(--radius); }
.win.maximized .win-body { border-radius: 0; }
.win-body:focus { outline: none; }
.win.drop-target .win-body::after {
  content: "Drop to import here"; position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent);
  font-weight: 600; pointer-events: none;
}
.rz { position: absolute; z-index: 2; touch-action: none; }
.rz.n { top: -5px; left: 10px; right: 10px; height: 10px; cursor: ns-resize; }
.rz.s { bottom: -5px; left: 10px; right: 10px; height: 10px; cursor: ns-resize; }
.rz.e { right: -5px; top: 10px; bottom: 10px; width: 10px; cursor: ew-resize; }
.rz.w { left: -5px; top: 10px; bottom: 10px; width: 10px; cursor: ew-resize; }
.rz.ne { top: -6px; right: -6px; width: 16px; height: 16px; cursor: nesw-resize; }
.rz.nw { top: -6px; left: -6px; width: 16px; height: 16px; cursor: nwse-resize; }
.rz.se { bottom: -6px; right: -6px; width: 16px; height: 16px; cursor: nwse-resize; }
.rz.sw { bottom: -6px; left: -6px; width: 16px; height: 16px; cursor: nesw-resize; }
.win.maximized .rz { display: none; }
body.dragging, body.dragging * { user-select: none !important; -webkit-user-select: none !important; }
body.dragging iframe { pointer-events: none; }

/* ---- modal dialogs ---- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200000; background: var(--overlay);
  display: flex; align-items: center; justify-content: center; padding: 16px;
  animation: fade .12s ease-out;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  width: min(440px, 100%); max-height: calc(100% - 16px); display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-pop);
  animation: pop .14s ease-out;
}
.modal.wide { width: min(600px, 100%); }
.modal-title { padding: 16px 18px 4px; font-weight: 650; font-size: 15px; }
.modal-body { padding: 8px 18px 6px; overflow: auto; line-height: 1.45; }
.modal-body p { margin: 0 0 10px; }
.modal-body .input { margin-top: 4px; }
.modal-error { color: var(--danger); font-size: 12.5px; min-height: 18px; margin-top: 6px; }
.modal-buttons { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 16px; flex-wrap: wrap; }
.picker { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; margin-top: 8px; }
.picker-crumbs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.picker-list { height: 240px; overflow: auto; }
.picker-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; user-select: none; }
.picker-row:hover { background: var(--hover); }
.picker-row.selected { background: var(--selected); }
.picker-row.disabled { opacity: .45; cursor: default; }
.picker-row svg { width: 18px; height: 18px; flex-shrink: 0; }
.picker-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-empty { padding: 20px; text-align: center; color: var(--muted); }
.crumb { border: 0; background: transparent; padding: 3px 7px; border-radius: 6px; cursor: pointer; color: var(--text); font-size: 13px; }
.crumb:hover { background: var(--hover); }
.crumb.current { font-weight: 600; }
.crumb-sep { color: var(--muted); padding: 3px 0; font-size: 13px; }
.crumb.drop-over { background: var(--selected); outline: 2px solid var(--accent); }

/* ---- toasts & notices ---- */
#toasts { position: fixed; right: 12px; bottom: calc(var(--taskbar-h) + 12px); z-index: 300000; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 24px); }
.toast {
  pointer-events: auto; padding: 10px 14px; border-radius: 10px; max-width: 380px;
  background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow-pop);
  border-left: 4px solid var(--accent); animation: pop .16s ease-out; line-height: 1.35;
}
.toast.ok { border-left-color: var(--ok); }
.toast.warn { border-left-color: var(--warn); }
.toast.error { border-left-color: var(--danger); }
.toast.hide { opacity: 0; transform: translateY(6px); transition: .25s; }
#notices { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 250000; display: flex; flex-direction: column; gap: 8px; width: min(560px, calc(100vw - 24px)); }
.notice {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-pop);
  padding: 12px 14px; line-height: 1.45; border-top: 4px solid var(--warn); animation: pop .16s ease-out;
}
.notice .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
.notice label { margin-right: auto; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* ---- lock / setup screens ---- */
.screen {
  position: fixed; inset: 0; z-index: 400000; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: radial-gradient(circle at 20% 15%, #6a7cff 0, transparent 45%), radial-gradient(circle at 85% 80%, #b06ad9 0, transparent 45%), #232a46;
  color: #fff; overflow: auto;
}
.screen-card {
  width: min(400px, 100%); padding: 28px 26px; border-radius: 20px;
  background: rgba(20, 24, 40, .55); border: 1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 30px 60px rgba(0,0,0,.35); text-align: center;
}
.screen-card .big-ico { width: 64px; height: 64px; margin: 0 auto 12px; }
.screen-card h1 { font-size: 21px; margin: 0 0 6px; font-weight: 650; }
.screen-card p { margin: 0 0 14px; color: rgba(255,255,255,.78); line-height: 1.45; font-size: 13.5px; }

.screen-card .input:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
.screen-card .btn { min-height: 40px; width: 100%; margin-top: 4px; }

/* ---- src/styles/30-apps.css ---- */
/* =====================================================================
   APPS
   ===================================================================== */

/* ---- Files ---- */

.ex-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px 110px; align-items: center; gap: 10px; padding: 0 12px; height: 34px; user-select: none; -webkit-user-select: none; }
.ex-row:not(.ex-head):hover { background: var(--hover); }
.ex-row.selected { background: var(--selected); }
.ex-row.drop-over { background: var(--selected); box-shadow: inset 0 0 0 2px var(--accent); }
.ex-head { height: 30px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--surface); }
.ex-row .c-name { display: flex; align-items: center; gap: 9px; min-width: 0; }

.ex-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-row .c-size, .ex-row .c-date { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ex-empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.ex-status { padding: 5px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 560px) { .ex-row { grid-template-columns: minmax(0, 1fr) 90px; } .ex-row .c-date { display: none; } }

/* ---- Notepad ---- */
.app-notepad .np-main { flex: 1; min-height: 0; display: flex; }
.np-text { flex: 1; border: 0; outline: none; resize: none; padding: 14px 16px; background: var(--surface); color: var(--text); font-family: var(--mono); font-size: 13.5px; line-height: 1.55; tab-size: 4; }

.np-preview { flex: 1; overflow: auto; padding: 14px 22px; }
.np-status { padding: 5px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-wrap { display: flex; align-items: center; gap: 5px; padding: 0 6px; }

.md h1, .md h2, .md h3 { line-height: 1.25; margin: 1em 0 .5em; }
.md h1 { font-size: 1.7em; } .md h2 { font-size: 1.35em; } .md h3 { font-size: 1.15em; }
.md code { font-family: var(--mono); background: var(--surface-3); padding: 1px 5px; border-radius: 5px; font-size: .92em; }
.md pre { background: var(--surface-3); padding: 12px; border-radius: 8px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 1em; padding: 4px 14px; border-left: 4px solid var(--border-strong); color: var(--muted); }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--border); }

/* ---- To-do ---- */
.app-todo .td-add { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
.app-todo .td-add .btn { width: 40px; padding: 0; }

.td-item.dragging { opacity: .85; box-shadow: var(--shadow-pop); position: relative; z-index: 2; border-radius: 8px; }
.td-grip { width: 22px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: grab; color: var(--muted); touch-action: none; flex-shrink: 0; }
.td-grip svg { width: 16px; height: 16px; stroke-width: 3; }

.td-item .icon-btn svg { width: 15px; height: 15px; }
.td-edit { flex: 1; }
.td-empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.td-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--surface-2); min-height: 46px; }

/* ---- Calculator ---- */
.app-calc { background: var(--surface-2); padding: 12px; gap: 12px; }
.calc-display { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; text-align: right; min-height: 92px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.calc-expr { font-size: 28px; font-weight: 600; word-break: break-all; font-variant-numeric: tabular-nums; }

.pt-stage { flex: 1; min-height: 0; overflow: auto; padding: 16px; background: var(--surface-3); }
.pt-paper { display: inline-block; box-shadow: 0 2px 10px rgba(0,0,0,.18); line-height: 0;
  background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
.pt-canvas { touch-action: none; cursor: crosshair; display: block; }

/* ---- Settings ---- */
.app-settings { flex-direction: row; }
.st-nav { width: 200px; flex-shrink: 0; padding: 10px; border-right: 1px solid var(--border); background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; overflow: auto; }

.st-tab.active { background: var(--selected); color: var(--accent); font-weight: 600; }
.st-tab svg { width: 18px; height: 18px; }
.st-main { flex: 1; min-width: 0; overflow: auto; padding: 18px 22px; }
.st-main h2 { margin: 0 0 14px; font-size: 20px; }
.st-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; background: var(--surface); }
.st-card h3 { margin: 0 0 6px; font-size: 15px; }
.st-card p { margin: 0 0 10px; line-height: 1.45; font-size: 13px; }
.st-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }

.st-wp { height: 60px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; display: flex; align-items: flex-end; padding: 5px 7px; color: #fff; font-size: 11px; text-transform: capitalize; text-shadow: 0 1px 2px rgba(0,0,0,.5); }

.st-color { display: flex; align-items: center; gap: 8px; }

.st-check { display: flex; align-items: center; gap: 8px; }
.st-status { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; }
.st-status svg { width: 20px; height: 20px; flex-shrink: 0; }
.st-status.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.st-status.off { background: var(--surface-2); }
.st-warn { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; margin: 8px 0; background: color-mix(in srgb, var(--warn) 14%, transparent); }
.st-warn svg { width: 20px; height: 20px; flex-shrink: 0; color: var(--warn); }
.st-big { font-size: 28px; font-weight: 650; margin-bottom: 6px; }
.st-big.warn { color: var(--warn); }
.st-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.st-table th, .st-table td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
.st-table td:last-child, .st-table th:last-child { text-align: right; white-space: nowrap; }
.st-table a { color: var(--accent); text-decoration: none; word-break: break-all; }
@media (max-width: 640px) {
  .app-settings { flex-direction: column; }
  .st-nav { width: auto; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }

  .st-main { padding: 14px; }
}

/* ---- Terminal ---- */
.app-terminal { background: #12151c; }
.term { flex: 1; overflow: auto; padding: 10px 12px; font-family: var(--mono); font-size: 13px; line-height: 1.5; color: #d8dee9; cursor: text; }

.term-line { display: flex; align-items: baseline; }

.term-in { flex: 1; min-width: 40px; border: 0; outline: none; background: transparent; color: #fff; font: inherit; padding: 0; caret-color: #7dffb2; }

    if (OS.apps.has(def.id)) throw new Error('registerApp: duplicate app id "' + def.id + '"');

})();

/* ---- src/core/04-crypto.js ---- */
/* =====================================================================
   CORE 4: CRYPTO (optional password)
   PBKDF2-SHA-256 (600,000 iterations, 16-byte random salt) -> AES-GCM-256.
   A fresh random 12-byte IV is used for every encryption.
   The derived CryptoKey is non-extractable and lives only in memory.
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util;
  var ITERATIONS = 600000;

  var subtle = (window.crypto && window.crypto.subtle) || null;
  var available = !!(subtle && window.crypto.getRandomValues && window.isSecureContext !== false);

    'Your browser does not provide the Web Crypto API on this page' +
    (window.isSecureContext === false ? ' (the page is not treated as a secure context)' : '') +
    ', so password protection is disabled. Your data is stored unencrypted.';

  function rand(n) { var b = new Uint8Array(n); crypto.getRandomValues(b); return b; }

  async function deriveKey(password, salt, iterations) {
    var base = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  async function encryptWith(keyInfo, obj, fileId) {
    var iv = rand(12);
    var plain = new TextEncoder().encode(JSON.stringify(obj));
    var ct = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv: iv }, keyInfo.key, plain));
    return {
      version: OS.storage.SCHEMA_VERSION, fileId: fileId, encrypted: true,
      salt: U.bytesToB64(keyInfo.salt), iv: U.bytesToB64(iv), iterations: keyInfo.iterations,
      ciphertext: U.bytesToB64(ct)
    };
  }

  async function decryptWith(key, env) {
    var pt = await subtle.decrypt({ name: 'AES-GCM', iv: U.b64ToBytes(env.iv) }, key, U.b64ToBytes(env.ciphertext));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  OS.crypto = {
    ITERATIONS: ITERATIONS,
    available: available,
    unavailableReason: unavailableReason,
    isEnabled: function () { return !!current; },

    /** Set or change the password (derives a new key with a new salt). */
    setPassword: async function (password) {
      if (!available) throw new Error(unavailableReason);
      var salt = rand(16);
      current = { key: await deriveKey(password, salt, ITERATIONS), salt: salt, iterations: ITERATIONS };
    },
    removePassword: function () { current = null; },
    /** Forget the key (used by Lock now). */
    forgetKey: function () { current = null; },

    /** Check a password against the in-memory key without exposing it. */
    verify: async function (password) {
      if (!current) return false;
      var k = await deriveKey(password, current.salt, current.iterations);
      var probe = await encryptWith(current, { probe: 1 }, '');
      try { await decryptWith(k, probe); return true; } catch (e) { return false; }
    },

    /** Encrypt the whole state into an envelope (the only thing stored when a password is set). */
    encryptState: function (state) {
      if (!current) throw new Error('No password set');
      return encryptWith(current, state, state.fileId);
    },

    /**
     * Decrypt an envelope with a password. On success the derived key becomes the active key.
     * Throws { wrongPassword: true } if AES-GCM authentication fails.
     */
    unlock: async function (env, password, opts) {
      if (!available) throw new Error(unavailableReason);
      var salt = U.b64ToBytes(env.salt), it = env.iterations || ITERATIONS;
      var key = await deriveKey(password, salt, it);
      var data;
      try { data = await decryptWith(key, env); }
      catch (e) { var err = new Error('Wrong password'); err.wrongPassword = true; throw err; }
      if (!opts || !opts.dontActivate) current = { key: key, salt: salt, iterations: it };
      return data;
    },

    /** Decrypt using the active key if the salt matches (used for backups). */
    tryActiveKey: async function (env) {
      if (!current || U.bytesToB64(current.salt) !== env.salt) return null;
      try { return await decryptWith(current.key, env); } catch (e) { return null; }
    }
  };
})();

/* ---- src/core/05-vfs.js ---- */
/* =====================================================================
   CORE 5: VIRTUAL FILE SYSTEM
   The ONLY code allowed to touch OS.state.vfs. Apps and the terminal
   use this API. Nodes:

    html: 'text/html', htm: 'text/html', css: 'text/css', js: 'text/javascript', xml: 'application/xml', svg: 'image/svg+xml',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp',
    pdf: 'application/pdf', zip: 'application/zip', mp3: 'audio/mpeg', wav: 'audio/wav', mp4: 'video/mp4'

/* ---- src/core/06-dialogs.js ---- */
/* =====================================================================
   CORE 6: UI HELPERS (non-blocking dialogs, VFS pickers, toasts, notices)
   Apps must use these instead of window.alert/confirm/prompt.
   ===================================================================== */

   * Generic modal. opts: { title, body: Node|string, buttons:[{label,value,primary,danger}], wide,

        return h('button', { class: 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''), type: 'button',
          onclick: function () { submit(b.value); } }, b.label);
      });

        opts.title ? h('div', { class: 'modal-title' }, opts.title) : null,
        h('div', { class: 'modal-body' }, body, errEl),
        h('div', { class: 'modal-buttons' }, buttons));

      win.el.addEventListener('dragover', function (e) { if (Array.from(e.dataTransfer.types || []).indexOf('Files') >= 0) { e.preventDefault(); e.stopPropagation(); } });
      win.el.addEventListener('drop', function (e) {

      setTimeout(function () { list.focus(); }, 0);
    }
  });
})();

/* =====================================================================
   APP: NOTEPAD (text + Markdown with a safe preview)
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util, h = U.h;

  /** Small, safe Markdown renderer: escapes ALL HTML first, then adds formatting. */
  function renderMarkdown(src) {
    var esc = U.escapeHtml;
    function inline(s) {
      s = esc(s);
      var codes = [];
      s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>').replace(/(^|[^\w_])_([^_]+)_(?=[^\w]|$)/g, '$1<em>$2</em>')
        .replace(/~~([^~]+)~~/g, '<del>$1</del>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, text, url) {
          var u = url.replace(/&amp;/g, '&');
          if (!/^(https?:|mailto:)/i.test(u)) return text;   // no javascript:, data:, etc.
          return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
        });
      return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + codes[+i] + '</code>'; });
    }
    var lines = src.replace(/\r\n?/g, '\n').split('\n'), out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
      }
      var m;
      if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^>\s?/.test(l)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ''));
        out.push('<blockquote>' + q.map(inline).join('<br>') + '</blockquote>'); continue;
      }
      if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
        var ordered = /^\s*\d+\./.test(l), items = [];
        while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
          var t = lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, ''), cb = /^\[( |x)\]\s+/i.exec(t);
          items.push('<li>' + (cb ? '<input type="checkbox" disabled' + (cb[1] !== ' ' ? ' checked' : '') + '> ' + inline(t.slice(cb[0].length)) : inline(t)) + '</li>');
        }
        out.push((ordered ? '<ol>' : '<ul>') + items.join('') + (ordered ? '</ol>' : '</ul>')); continue;
      }
      if (!l.trim()) { i++; continue; }
      var p = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s+)/.test(lines[i])) p.push(lines[i++]);
      out.push('<p>' + p.map(inline).join('<br>') + '</p>');
    }
    return out.join('\n');
  }
  OS.renderMarkdown = renderMarkdown;

  OS.registerApp({
    id: 'notepad',
    name: 'Notepad',
    icon: OS.appIcons.notepad,
    fileTypes: ['txt', 'md', 'markdown', 'json', 'csv', 'log', 'js', 'css', 'html', 'htm', 'xml', 'ini', 'yml', 'yaml', 'py', 'sh'],
    mimeTypes: ['text/'],
    defaultSize: { w: 640, h: 440 },
    launch: function (win, args) {
      var vfs = win.vfs, dlg = win.dialogs;
      var fileId = null, name = 'Untitled.txt', dirty = false, preview = false;

      var ta = h('textarea', { class: 'np-text', spellcheck: 'false', 'aria-label': 'Text' });
      var pv = h('div', { class: 'np-preview md', hidden: true });
      var status = h('div', { class: 'np-status' });
      var bPrev = h('button', { class: 'btn', type: 'button', title: 'Toggle Markdown preview' }, h('span', { html: OS.icons.eye }), 'Preview');
      var wrapCb = h('input', { type: 'checkbox', checked: true });
      win.body.classList.add('app-notepad');
      win.body.append(
        h('div', { class: 'toolbar' },
          h('button', { class: 'btn', type: 'button', onclick: function () { newDoc(); } }, 'New'),
          h('button', { class: 'btn', type: 'button', onclick: function () { openDoc(); } }, 'Open…'),
          h('button', { class: 'btn', type: 'button', onclick: function () { save(); } }, 'Save'),
          h('button', { class: 'btn', type: 'button', onclick: function () { saveAs(); } }, 'Save as…'),
          h('span', { class: 'sep' }), bPrev, h('span', { class: 'grow' }),
          h('label', { class: 'small muted np-wrap' }, wrapCb, 'Wrap')),
        h('div', { class: 'np-main' }, ta, pv), status);

      function isMd() { return /\.(md|markdown)$/i.test(name); }
      function updateTitle() {
        win.setTitle((dirty ? '● ' : '') + name + ' - Notepad');
        bPrev.hidden = !isMd();
        if (!isMd() && preview) togglePreview(false);
        var text = ta.value;
        status.textContent = (fileId ? vfs.pathOf(fileId) : 'Not saved yet') + '  ·  ' + text.split('\n').length + ' lines, ' + text.length + ' characters' + (dirty ? '  ·  edited' : '');
      }
      function setDirty(d) { dirty = d; win.setDirty(d); updateTitle(); }
      function togglePreview(on) {
        preview = on == null ? !preview : on;
        bPrev.classList.toggle('primary', preview);
        pv.hidden = !preview; ta.hidden = preview;
        if (preview) pv.innerHTML = renderMarkdown(ta.value); else ta.focus();
      }
      function load(id) {
        var s = vfs.stat(id);
        fileId = id; name = s.name; ta.value = vfs.readText(id);
        setDirty(false); togglePreview(false);
        ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
      }
      async function confirmDiscard() {
        if (!dirty) return true;
        var v = await dlg.choose('Save changes to "' + name + '"?', [
          { label: 'Cancel', value: null }, { label: "Don't save", value: 'discard', danger: true }, { label: 'Save', value: 'save', primary: true }], { title: 'Notepad' });
        if (v === 'save') return await save();
        return v === 'discard';
      }
      async function newDoc() { if (!(await confirmDiscard())) return; fileId = null; name = 'Untitled.txt'; ta.value = ''; setDirty(false); togglePreview(false); }
      async function openDoc() {
        if (!(await confirmDiscard())) return;
        var id = await dlg.openFile({ title: 'Open text file', start: fileId ? vfs.stat(fileId).parent : (vfs.resolvePath('/Documents') || vfs.root()) });
        if (id) { try { load(id); } catch (e) { dlg.alert(e.message); } }
      }
      async function save() {
        if (!fileId || !vfs.exists(fileId)) return saveAs();
        try { vfs.write(fileId, ta.value); setDirty(false); return true; } catch (e) { dlg.alert(e.message); return false; }
      }
      async function saveAs() {
        var r = await dlg.saveAs({ title: 'Save as', defaultName: name, start: fileId && vfs.exists(fileId) ? vfs.stat(fileId).parent : (vfs.resolvePath('/Documents') || vfs.root()) });
        if (!r) return false;
        try {
          fileId = r.existingId ? (vfs.write(r.existingId, ta.value), r.existingId) : vfs.createFile(r.parentId, r.name, ta.value);
          name = r.name; setDirty(false); return true;
        } catch (e) { dlg.alert(e.message); return false; }
      }

      ta.addEventListener('input', function () { if (!dirty) setDirty(true); else updateTitle(); });
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          var s = ta.selectionStart, en = ta.selectionEnd;
          ta.setRangeText('\t', s, en, 'end'); ta.dispatchEvent(new Event('input'));
        }
      });
      bPrev.addEventListener('click', function () { togglePreview(); });
      wrapCb.addEventListener('change', function () { ta.classList.toggle('nowrap', !wrapCb.checked); });

      // Ctrl+S: commit this note into the file system first, then the OS saves the file.
      win.onSaveShortcut = async function () { if (dirty) await save(); };
      win.onClose(confirmDiscard);
      var off = vfs.on('change', function (ev) {
        if (fileId && !vfs.exists(fileId)) { fileId = null; setDirty(true); }
        else if (fileId && ev.id === fileId) { name = vfs.stat(fileId).name; updateTitle(); }
      });
      win.onDestroy(off);

      if (args.fileId && vfs.exists(args.fileId)) load(args.fileId); else { updateTitle(); ta.focus(); }
    }
  });
})();

/* =====================================================================
   APP: TO-DO LIST (state stored in data.apps.todo)
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util, h = U.h;

  OS.registerApp({
    id: 'todo',
    name: 'To-do',
    icon: OS.appIcons.todo,
    defaultSize: { w: 440, h: 520 },
    singleInstance: true,
    launch: function (win) {
      function items() { return win.getState({ items: [] }).items; }
      function commit(list) { win.setState({ items: list }); render(); }

      var input = h('input', { class: 'input', type: 'text', placeholder: 'Add a task and press Enter', 'aria-label': 'New task', maxlength: '500' });
      var addBtn = h('button', { class: 'btn primary', type: 'button', title: 'Add', html: OS.icons.plus });
      var list = h('ul', { class: 'td-list' });
      var footer = h('div', { class: 'td-footer' });
      win.body.classList.add('app-todo');
      win.body.append(h('form', { class: 'td-add', onsubmit: function (e) { e.preventDefault(); add(); } }, input, addBtn), list, footer);
      addBtn.addEventListener('click', add);

      function add() {
        var t = input.value.trim(); if (!t) return;
        var l = items().slice(); l.push({ id: U.uid(6), text: t, done: false });
        input.value = ''; commit(l); input.focus();
      }
      function update(id, patch) { commit(items().map(function (it) { return it.id === id ? Object.assign({}, it, patch) : it; })); }
      function remove(id) { commit(items().filter(function (it) { return it.id !== id; })); }
      function moveBy(id, d) {
        var l = items().slice(), i = l.findIndex(function (x) { return x.id === id; }), j = i + d;
        if (i < 0 || j < 0 || j >= l.length) return;
        var t = l[i]; l[i] = l[j]; l[j] = t; commit(l);
        var b = list.querySelector('[data-id="' + id + '"] .td-' + (d < 0 ? 'up' : 'down')); if (b) b.focus();
      }
      function edit(li, it) {
        var ed = h('input', { class: 'input td-edit', type: 'text', maxlength: '500' }); ed.value = it.text;
        var txt = li.querySelector('.td-text'); txt.replaceWith(ed); ed.focus(); ed.select();
        var finished = false;
        function done(save) {
          if (finished) return; finished = true;
          var v = ed.value.trim();
          if (save && v && v !== it.text) update(it.id, { text: v }); else render();
        }
        ed.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); done(true); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); } });
        ed.addEventListener('blur', function () { done(true); });
      }

      /* pointer-based drag reorder via the grip handle (works with mouse and touch) */
      function startDrag(e, li, id) {
        if (e.button !== 0) return;
        e.preventDefault();
        var grip = e.currentTarget; grip.setPointerCapture(e.pointerId);
        li.classList.add('dragging');
        function move(ev) {
          var siblings = Array.from(list.children).filter(function (c) { return c !== li; });
          var before = siblings.find(function (c) { var r = c.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
          if (before) list.insertBefore(li, before); else list.appendChild(li);
        }
        function up() {
          grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
          li.classList.remove('dragging');
          var order = Array.from(list.children).map(function (c) { return c.dataset.id; });
          var byId = {}; items().forEach(function (x) { byId[x.id] = x; });
          var newList = order.map(function (k) { return byId[k]; }).filter(Boolean);
          if (newList.map(function (x) { return x.id; }).join() !== items().map(function (x) { return x.id; }).join()) commit(newList);
        }
        grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
      }

      function render() {
        if (win.closed) return;
        var l = items();
        list.textContent = '';
        if (!l.length) list.appendChild(h('li', { class: 'td-empty' }, 'Nothing to do. Add a task above.'));
        l.forEach(function (it, i) {
          var cb = h('input', { type: 'checkbox', class: 'td-check', checked: !!it.done, 'aria-label': 'Done' });
          var li = h('li', { class: 'td-item' + (it.done ? ' done' : ''), dataset: { id: it.id } },
            h('span', { class: 'td-grip', title: 'Drag to reorder', html: OS.icons.grip }),
            cb,
            h('span', { class: 'td-text', title: 'Double-click to edit' }, it.text),
            h('button', { class: 'icon-btn td-up', type: 'button', title: 'Move up', 'aria-label': 'Move up', disabled: i === 0, html: OS.icons.chevUp }),
            h('button', { class: 'icon-btn td-down', type: 'button', title: 'Move down', 'aria-label': 'Move down', disabled: i === l.length - 1, html: OS.icons.chevDown }),
            h('button', { class: 'icon-btn td-editbtn', type: 'button', title: 'Edit', 'aria-label': 'Edit', html: OS.icons.edit }),
            h('button', { class: 'icon-btn td-del', type: 'button', title: 'Delete', 'aria-label': 'Delete', html: OS.icons.trash }));
          cb.addEventListener('change', function () { update(it.id, { done: cb.checked }); });
          li.querySelector('.td-text').addEventListener('dblclick', function () { edit(li, it); });
          li.querySelector('.td-editbtn').addEventListener('click', function () { edit(li, it); });
          li.querySelector('.td-del').addEventListener('click', function () { remove(it.id); });
          li.querySelector('.td-up').addEventListener('click', function () { moveBy(it.id, -1); });
          li.querySelector('.td-down').addEventListener('click', function () { moveBy(it.id, 1); });
          li.querySelector('.td-grip').addEventListener('pointerdown', function (e) { startDrag(e, li, it.id); });
          list.appendChild(li);
        });
        var done = l.filter(function (x) { return x.done; }).length;
        footer.textContent = '';
        footer.append(h('span', { class: 'muted small' }, (l.length - done) + ' left · ' + done + ' done'),
          done ? h('button', { class: 'btn', type: 'button', onclick: function () { commit(items().filter(function (x) { return !x.done; })); } }, 'Clear completed') : null);
      }
      render();
      setTimeout(function () { input.focus(); }, 0);
    }
  });
})();

/* ---- src/apps/40-calculator.js ---- */
/* =====================================================================
   APP: CALCULATOR (own expression parser, no eval)
   Grammar (precedence low -> high):
     expr    := term (('+' | '-') term)*
     term    := unary (('*' | '/') unary | implicit '(' unary)*
     unary   := ('-' | '+') unary | power
     power   := postfix ('^' unary)?          (right-associative, -2^2 = -4)
     postfix := primary '%'*                  (50% = 0.5)
     primary := number | '(' expr ')'
   ===================================================================== */
(function () {
  'use strict';
  var h = OS.util.h;

  function tokenize(s) {
    var out = [], i = 0;
    s = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    while (i < s.length) {
      var c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        var m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));
        if (!m) throw new Error('Bad number');
        out.push({ t: 'n', v: parseFloat(m[0]) }); i += m[0].length; continue;
      }
      if ('+-*/^%()'.indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }
      throw new Error('Unexpected "' + c + '"');
    }
    return out;
  }

  function evaluate(src) {
    var tk = tokenize(src), p = 0;
    function peek() { return tk[p] && tk[p].t; }
    function eat(t) { if (peek() !== t) throw new Error('Expected ' + t); p++; }
    function expr() {
      var v = term();
      while (peek() === '+' || peek() === '-') { var op = tk[p++].t, r = term(); v = op === '+' ? v + r : v - r; }
      return v;
    }
    function term() {
      var v = unary();
      for (;;) {
        var t = peek();
        if (t === '*' || t === '/') {
          p++; var r = unary();
          if (t === '/' && r === 0) throw new Error('Cannot divide by zero');
          v = t === '*' ? v * r : v / r;
        } else if (t === '(') { v = v * unary(); }       // implicit multiplication: 2(3)
        else return v;
      }
    }
    function unary() {
      if (peek() === '-') { p++; return -unary(); }
      if (peek() === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      var b = postfix();
      if (peek() === '^') { p++; return Math.pow(b, unary()); }
      return b;
    }
    function postfix() { var v = primary(); while (peek() === '%') { p++; v = v / 100; } return v; }
    function primary() {
      var t = tk[p];
      if (!t) throw new Error('Incomplete expression');
      if (t.t === 'n') { p++; return t.v; }
      if (t.t === '(') { p++; var v = expr(); eat(')'); return v; }
      throw new Error('Unexpected "' + t.t + '"');
    }
    if (!tk.length) return 0;
    var v = expr();
    if (p < tk.length) throw new Error('Unexpected "' + tk[p].t + '"');
    if (!isFinite(v)) throw new Error('Result is too large');
    return v;
  }
  function format(v) {
    if (Object.is(v, -0)) v = 0;
    var r = parseFloat(v.toPrecision(12));
    return Math.abs(r) >= 1e15 || (Math.abs(r) < 1e-9 && r !== 0) ? r.toExponential(8).replace(/\.?0+e/, 'e') : String(r);
  }
  OS.calc = { evaluate: evaluate, format: format };

  OS.registerApp({
    id: 'calculator',
    name: 'Calculator',
    icon: OS.appIcons.calculator,
    defaultSize: { w: 320, h: 470 },
    launch: function (win) {
      var expr = '', justEvaluated = false;
      var exprEl = h('div', { class: 'calc-expr', 'aria-live': 'polite' });
      var resEl = h('div', { class: 'calc-res' });
      var keys = [
        ['C', 'clear'], ['(', '('], [')', ')'], ['⌫', 'back'],
        ['7', '7'], ['8', '8'], ['9', '9'], ['÷', '/'],
        ['4', '4'], ['5', '5'], ['6', '6'], ['×', '*'],
        ['1', '1'], ['2', '2'], ['3', '3'], ['−', '-'],
        ['0', '0'], ['.', '.'], ['%', '%'], ['+', '+'],
        ['x^y', '^'], ['=', '=']
      ];
      var pad = h('div', { class: 'calc-pad' });
      keys.forEach(function (k) {
        var cls = 'calc-key' + (/[\/*\-+^%()]/.test(k[1]) ? ' op' : '') + (k[1] === '=' ? ' eq' : '') + (k[1] === 'clear' || k[1] === 'back' ? ' fn' : '');
        pad.appendChild(h('button', { class: cls, type: 'button', tabindex: '-1', onclick: function () { press(k[1]); win.body.focus(); } }, k[0]));
      });
      win.body.classList.add('app-calc');
      win.body.append(h('div', { class: 'calc-display' }, exprEl, resEl), pad);

      function show() {
        exprEl.textContent = expr.replace(/\*/g, '×').replace(/\//g, '÷') || '0';
        if (justEvaluated) return;
        try { resEl.textContent = expr ? '= ' + format(evaluate(expr)) : ''; resEl.classList.remove('err'); }
        catch (e) { resEl.textContent = ''; }
      }
      function press(k) {
        if (k === 'clear') { expr = ''; justEvaluated = false; resEl.textContent = ''; }
        else if (k === 'back') { expr = expr.slice(0, -1); justEvaluated = false; }
        else if (k === '=') {
          try { var v = format(evaluate(expr)); resEl.textContent = expr + ' ='; resEl.classList.remove('err'); expr = v; justEvaluated = true; exprEl.textContent = v; return; }
          catch (e) { resEl.textContent = e.message; resEl.classList.add('err'); justEvaluated = true; return; }
        } else {
          if (justEvaluated && /[0-9.(]/.test(k)) expr = '';
          justEvaluated = false;
          expr += k;
        }
        show();
      }
      win.body.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        var k = e.key;
        if (/^[0-9.+\-*/^%()]$/.test(k)) { e.preventDefault(); press(k); }
        else if (k === 'x' || k === 'X') { e.preventDefault(); press('*'); }
        else if (k === 'Enter' || k === '=') { e.preventDefault(); press('='); }
        else if (k === 'Backspace') { e.preventDefault(); press('back'); }
        else if (k === 'Escape' || k === 'Delete') { e.preventDefault(); press('clear'); }
      });
      win.el.addEventListener('pointerdown', function () { setTimeout(function () { if (!win.body.contains(document.activeElement) || document.activeElement === document.body) win.body.focus(); }, 0); });
      show();
      setTimeout(function () { win.body.focus(); }, 0);
    }
  });
})();

/* ---- src/apps/50-paint.js ---- */
/* =====================================================================
   APP: PAINT
   The picture has a logical size (W x H, the PNG size). The backing
   canvas is W*dpr x H*dpr so strokes look crisp on high-DPI screens;
   saving downsamples to exactly W x H.
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util, h = U.h;
  var MAX_UNDO = 30;

  OS.registerApp({
    id: 'paint',
    name: 'Paint',
    icon: OS.appIcons.paint,
    fileTypes: ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp'],
    mimeTypes: ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/bmp'],

            h('tr', null, h('td', null, 'Last saved'), h('td', null, st.savedAt ? new Date(st.savedAt).toLocaleString() : 'never')),
            h('tr', null, h('td', null, 'Direct file saving'), h('td', null, OS.storage.hasFSA() ? 'available (File System Access API)' : 'not available: downloads a copy')),
            h('tr', null, h('td', null, 'Encryption'), h('td', null, OS.crypto.available ? 'available' : 'unavailable')),
            h('tr', null, h('td', null, 'Apps installed'), h('td', null, String(OS.apps.size)))))));
        m.appendChild(card('Crash-recovery backup', 'While you have unsaved changes, a backup is kept in this browser every 30 seconds. It stays only on this computer, and it is encrypted if you use a password. If the tab crashes, reopen the same file here to restore it.',
          row(h('button', { class: 'btn', type: 'button', onclick: async function () {
            await OS.storage.backup.remove(st.fileId); OS.toast('Backup removed from this browser');
          } }, 'Remove backup from this browser'))));
      }

      win._onRelaunch = function (a) { if (a.section) go(a.section); };
      var offs = [OS.events.on('size', function () { if (current === 'storage') render(); })];
      win.onDestroy(function () { offs.forEach(function (f) { f(); }); });
      render();
    }
  });
})();

/* =====================================================================
   APP: TERMINAL (all commands go through the VFS API)
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util, h = U.h;

  /** Split a command line into words, honoring quotes and backslash escapes. ">" and ">>" are separate tokens. */
  function parse(line) {
    var out = [], cur = '', q = null, has = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (q) {
        if (c === q) q = null;
        else if (c === '\\' && q === '"' && i + 1 < line.length) cur += line[++i];
        else cur += c;
        continue;
      }
      if (c === '"' || c === "'") { q = c; has = true; continue; }
      if (c === '\\' && i + 1 < line.length) { cur += line[++i]; has = true; continue; }
      if (/\s/.test(c)) { if (has) { out.push(cur); cur = ''; has = false; } continue; }
      if (c === '>') {
        if (has) { out.push(cur); cur = ''; has = false; }
        if (line[i + 1] === '>') { out.push({ op: '>>' }); i++; } else out.push({ op: '>' });
        continue;
      }
      cur += c; has = true;
    }
    if (q) throw new Error('Missing closing quote');
    if (has) out.push(cur);
    return out;
  }

  OS.registerApp({
    id: 'terminal',
    name: 'Terminal',
    icon: OS.appIcons.terminal,
    defaultSize: { w: 680, h: 420 },
    launch: function (win, args) {
      var vfs = win.vfs;
      var cwd = vfs.root(), history = [], hIdx = 0, draft = '';
      var out = h('div', { class: 'term-out', role: 'log', 'aria-live': 'polite' });
      var promptEl = h('span', { class: 'term-prompt' });
      var input = h('input', { class: 'term-in', type: 'text', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', 'aria-label': 'Command' });
      var line = h('div', { class: 'term-line' }, promptEl, input);
      var scroller = h('div', { class: 'term' }, out, line);
      win.body.classList.add('app-terminal');
      win.body.append(scroller);
      scroller.addEventListener('pointerup', function () { if (!getSelection().toString()) input.focus(); });

      function cwdPath() { if (!vfs.exists(cwd)) cwd = vfs.root(); return vfs.pathOf(cwd); }
      function updatePrompt() { promptEl.textContent = 'you@myos:' + cwdPath() + '$ '; }
      function print(text, cls) { out.appendChild(h('div', { class: 'term-row' + (cls ? ' ' + cls : '') }, text)); }
      function err(text) { print(text, 'err'); }
      function need(path, what) {
        var id = vfs.resolvePath(path, cwd);
        if (!id) throw new Error(what + ': ' + path + ': No such file or folder');
        return id;
      }

      var commands = {
        help: { usage: 'help', desc: 'show this help', run: function () {
          Object.keys(commands).forEach(function (k) { print(commands[k].usage.padEnd(24) + commands[k].desc); });
          print('Paths: absolute (/Documents/a.txt) or relative (../a.txt). Use quotes for names with spaces. Up/Down: history. Tab: complete.', 'muted');
        } },
        ls: { usage: 'ls [-l] [path]', desc: 'list a folder', run: function (a) {
          var long = a[0] === '-l' || a[0] === '-la' || a[0] === '-al'; if (long) a = a.slice(1);
          var id = a.length ? need(a[0], 'ls') : cwd;
          var st = vfs.stat(id);
          var items = st.type === 'folder' ? vfs.list(id) : [st];
          if (!items.length) return;
          if (long) items.forEach(function (m) {
            print((m.type === 'folder' ? 'd ' : '- ') + U.formatBytes(m.size).padStart(9) + '  ' + new Date(m.modified).toLocaleString().padEnd(22) + '  ' + m.name + (m.type === 'folder' ? '/' : ''));
          });
          else print(items.map(function (m) { return m.name + (m.type === 'folder' ? '/' : ''); }).join('    '));
        } },
        cd: { usage: 'cd [path]', desc: 'change folder (cd .. goes up)', run: function (a) {
          var id = a.length ? need(a[0], 'cd') : vfs.root();
          if (!vfs.isFolder(id)) throw new Error('cd: ' + a[0] + ': Not a folder');
          cwd = id;
        } },
        pwd: { usage: 'pwd', desc: 'print current folder', run: function () { print(cwdPath()); } },
        cat: { usage: 'cat <file>...', desc: 'print file contents', run: function (a) {
          if (!a.length) throw new Error('cat: missing file');
          a.forEach(function (p) {
            var id = need(p, 'cat');
            if (vfs.isFolder(id)) throw new Error('cat: ' + p + ': Is a folder');
            var m = vfs.stat(id);
            if (m.encoding === 'base64' && !vfs.isTextLike(m.name, m.mime)) { print('[binary file, ' + U.formatBytes(m.size) + ', ' + m.mime + ']', 'muted'); return; }
            print(vfs.readText(id));
          });
        } },
        mkdir: { usage: 'mkdir [-p] <folder>...', desc: 'create folders', run: function (a) {
          var p = a[0] === '-p'; if (p) a = a.slice(1);
          if (!a.length) throw new Error('mkdir: missing folder name');
          a.forEach(function (path) {
            if (p) {
              var cur = path[0] === '/' ? vfs.root() : cwd;
              path.split('/').filter(Boolean).forEach(function (part) {
                if (part === '.') return;
                if (part === '..') { cur = vfs.stat(cur).parent || cur; return; }
                var ex = vfs.findChild(cur, part);
                if (ex) { if (!vfs.isFolder(ex)) throw new Error('mkdir: ' + part + ': exists and is not a folder'); cur = ex; }
                else cur = vfs.mkdir(cur, part);
              });
              return;
            }
            var r = vfs.resolveParent(path, cwd);
            if (!r.parentId) throw new Error('mkdir: ' + path + ': parent folder does not exist');
            vfs.mkdir(r.parentId, r.name);
          });
        } },
        touch: { usage: 'touch <file>...', desc: 'create empty file / update time', run: function (a) {
          if (!a.length) throw new Error('touch: missing file name');
          a.forEach(function (path) {
            var id = vfs.resolvePath(path, cwd);
            if (id) { vfs.touch(id); return; }
            var r = vfs.resolveParent(path, cwd);
            if (!r.parentId) throw new Error('touch: ' + path + ': parent folder does not exist');
            vfs.createFile(r.parentId, r.name, '');
          });
        } },
        rm: { usage: 'rm [-r] <path>...', desc: 'delete files (-r for folders)', run: function (a) {
          var rec = false;
          a = a.filter(function (x) { if (/^-[rRf]+$/.test(x)) { if (/[rR]/.test(x)) rec = true; return false; } return true; });
          if (!a.length) throw new Error('rm: missing operand');
          a.forEach(function (p) {
            var id = need(p, 'rm');
            if (id === vfs.root()) throw new Error('rm: refusing to remove the root folder');
            if (vfs.isFolder(id) && !rec) throw new Error('rm: ' + p + ': is a folder (use rm -r)');
            if (vfs.isAncestor(id, cwd)) cwd = vfs.stat(id).parent;
            vfs.delete(id);
          });
        } },
        mv: { usage: 'mv <src> <dest>', desc: 'move or rename', run: function (a) {
          if (a.length !== 2) throw new Error('mv: usage: mv <src> <dest>');
          var src = need(a[0], 'mv');
          var dest = vfs.resolvePath(a[1], cwd);
          if (dest && vfs.isFolder(dest)) { vfs.move(src, dest); return; }      // move into folder
          if (dest) throw new Error('mv: ' + a[1] + ': already exists');
          var r = vfs.resolveParent(a[1], cwd);
          if (!r.parentId) throw new Error('mv: ' + a[1] + ': folder does not exist');
          var e = vfs.nameError(r.name); if (e) throw new Error('mv: ' + e);
          if (r.parentId !== vfs.stat(src).parent) {
            if (vfs.isFolder(src) && vfs.isAncestor(src, r.parentId)) throw new Error('mv: cannot move a folder into itself');
            var oldName = vfs.stat(src).name;
            if (vfs.findChild(r.parentId, oldName) && oldName.toLowerCase() !== r.name.toLowerCase()) {
              throw new Error('mv: "' + oldName + '" already exists in the destination');
            }
            vfs.move(src, r.parentId);
          }
          vfs.rename(src, r.name);
        } },
        echo: { usage: 'echo <text> [> file|>> file]', desc: 'print text or write to a file', run: function (a, redir) {
          var text = a.join(' ');
          if (!redir) { print(text); return; }
          var id = vfs.resolvePath(redir.file, cwd);
          if (id && vfs.isFolder(id)) throw new Error('echo: ' + redir.file + ': Is a folder');
          if (id) { vfs.write(id, redir.op === '>>' ? vfs.readText(id) + text + '\n' : text + '\n', { encoding: 'text' }); return; }
          var r = vfs.resolveParent(redir.file, cwd);
          if (!r.parentId) throw new Error('echo: ' + redir.file + ': folder does not exist');
          vfs.createFile(r.parentId, r.name, text + '\n');
        } },
        open: { usage: 'open <path>', desc: 'open a file in its app', run: function (a) {
          if (!a.length) throw new Error('open: missing path');
          OS.openFile(need(a[0], 'open'));
        } },
        clear: { usage: 'clear', desc: 'clear the screen', run: function () { out.textContent = ''; } }
      };

      function exec(lineText) {
        print(promptEl.textContent + lineText, 'cmd');
        var words;
        try { words = parse(lineText); } catch (e) { err(e.message); return; }
        if (!words.length) return;
        var redir = null, idx = words.findIndex(function (w) { return typeof w === 'object'; });
        if (idx >= 0) {
          var f = words[idx + 1];
          if (typeof f !== 'string') { err('syntax error: expected a file name after ' + words[idx].op); return; }
          redir = { op: words[idx].op, file: f };
          words = words.slice(0, idx).concat(words.slice(idx + 2));
          if (words.some(function (w) { return typeof w === 'object'; })) { err('syntax error: only one redirection is supported'); return; }
        }
        var name = words[0], cmd = commands[name];
        if (!cmd) { err(name + ': command not found (type "help")'); return; }
        if (redir && name !== 'echo') { err('redirection is only supported for echo'); return; }
        try { cmd.run(words.slice(1), redir); } catch (e) { err(e.message); }
      }

      function complete() {
        var v = input.value, pos = input.selectionStart;
        var before = v.slice(0, pos), m = /(\S*)$/.exec(before), word = m[1];
        var first = !/\s/.test(before.trim()) && before.trim() === word;
        var cands;
        if (first) cands = Object.keys(commands).filter(function (c) { return c.indexOf(word) === 0; });
        else {
          var slash = word.lastIndexOf('/'), dirPart = slash >= 0 ? word.slice(0, slash + 1) : '', base = slash >= 0 ? word.slice(slash + 1) : word;
          var dirId = vfs.resolvePath(dirPart || '.', cwd);
          if (!dirId || !vfs.isFolder(dirId)) return;
          cands = vfs.list(dirId).filter(function (x) { return x.name.toLowerCase().indexOf(base.toLowerCase()) === 0; })
            .map(function (x) { return dirPart + x.name.replace(/ /g, '\\ ') + (x.type === 'folder' ? '/' : ''); });
        }
        if (cands.length === 1) {
          var ins = cands[0] + (first ? ' ' : '');
          input.value = before.slice(0, before.length - word.length) + ins + v.slice(pos);
          var np = before.length - word.length + ins.length; input.setSelectionRange(np, np);
        } else if (cands.length > 1) print(cands.join('    '), 'muted');
      }

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var v = input.value; input.value = '';
          if (v.trim()) { history.push(v); if (history.length > 200) history.shift(); }
          hIdx = history.length; draft = '';
          exec(v); updatePrompt();
          scroller.scrollTop = scroller.scrollHeight;
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (hIdx === history.length) draft = input.value;
          if (hIdx > 0) { hIdx--; input.value = history[hIdx]; }
          setTimeout(function () { input.setSelectionRange(input.value.length, input.value.length); }, 0);
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (hIdx < history.length) { hIdx++; input.value = hIdx === history.length ? draft : history[hIdx]; }
        } else if (e.key === 'Tab') { e.preventDefault(); complete(); }
        else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); out.textContent = ''; }
      });

      print('MyOS terminal. Type "help" for commands.', 'muted');
      updatePrompt();
      setTimeout(function () { input.focus(); }, 0);
      win._exec = exec; // used by tests
    }
  });
})();

/* =====================================================================
   EXAMPLE APP: how to add your own app
   ---------------------------------------------------------------------
   Copy this block, remove the comment markers, change the id/name, and
   rebuild (node build.js), or paste it at the end of the script in a
   built myos.html. That's all: the app gets a desktop icon, a start
   menu entry, a window, and (if fileTypes is set) opens matching files.

   OS.registerApp({
     id: 'hello',                       // unique id (also the key for saved window size and app state)
     name: 'Hello',
     icon: OS.appIcons.generic,         // any inline <svg> string
     fileTypes: [],                     // e.g. ['csv'] to open .csv files from Files / Terminal "open"
     defaultSize: { w: 360, h: 240 },
     singleInstance: false,
     launch: function (win, args) {
       // win.body       : element to render into
       // win.setTitle() : change the title bar text
       // win.close()    : close the window
       // win.onClose(fn): fn may return false (or a Promise of false) to keep the window open
       // win.getState(defaults) / win.setState(obj): persistent per-app data (saved in the file)
       // win.vfs, win.dialogs, win.toast, win.markDirty()
       var count = win.getState({ clicks: 0 }).clicks;
       var label = OS.util.h('p', { style: { padding: '16px' } }, 'Clicked ' + count + ' times');
       var btn = OS.util.h('button', { class: 'btn primary', style: { margin: '0 16px' } }, 'Click me');
       btn.addEventListener('click', function () {
         count++;
         win.setState({ clicks: count });     // marks the OS as having unsaved changes
         label.textContent = 'Clicked ' + count + ' times';
       });
       win.body.append(label, btn);
     }
   });
   ===================================================================== */

/* ---- src/boot.js ---- */
/* =====================================================================
   BOOT: load data -> (unlock) -> (first-run setup) -> desktop -> backup check
   Runs after all apps have registered.
   ===================================================================== */
(function () {
  'use strict';
  var U = OS.util, h = U.h;

  function fatal(title, msg, actions) {
    var card = h('div', { class: 'screen-card' }, h('h1', null, title), h('p', null, msg), actions || null);
    document.getElementById('os-root').appendChild(h('div', { class: 'screen' }, card));
  }

  async function checkBackup(password) {
    var st = OS.state, rec;
    try { rec = await OS.storage.backup.read(st.fileId); } catch (e) { return; }
    if (!rec || !(rec.backupAt > (st.savedAt || 0))) return;

    var restored = null, env = rec.envelope, pwForEnv = null;
    if (rec.data) restored = rec.data;
    else if (env) {
      restored = await OS.crypto.tryActiveKey(env);
      if (!restored && password) {
        try { restored = await OS.crypto.unlock(env, password, { dontActivate: true }); pwForEnv = password; } catch (e) { restored = null; }
      }
      while (!restored && OS.crypto.available) {
        var pw = await OS.dialogs.prompt('A crash-recovery backup from ' + new Date(rec.backupAt).toLocaleString() +
          ' was found, but it is encrypted with a different password. Enter that password to restore it, or cancel to ignore it.',
          { title: 'Recovery backup', type: 'password', okLabel: 'Decrypt' });
        if (pw == null) return;
        try { restored = await OS.crypto.unlock(env, pw, { dontActivate: true }); pwForEnv = pw; }
        catch (e) { OS.toast('Wrong password', 'error'); }
      }
    }
    if (!restored) return;

    var choice = await OS.dialogs.choose(
      'This browser has a crash-recovery backup from ' + new Date(rec.backupAt).toLocaleString() +
      ', which is newer than the data saved in this file' + (st.savedAt ? ' (' + new Date(st.savedAt).toLocaleString() + ')' : '') + '.\n' +
      'Restore it? If you ignore it, it will be overwritten the next time you make changes.',
      [{ label: 'Ignore', value: 'ignore' }, { label: 'Restore backup', value: 'restore', primary: true }],
      { title: 'Restore unsaved changes?' });
    if (choice !== 'restore') return;
    try {
      var data = OS.storage.migrate(restored);
      data.fileId = st.fileId;
      if (pwForEnv) await OS.crypto.unlock(env, pwForEnv);  // backup used a password: keep protecting the data with it
      await OS.wm.closeAll(true);
      OS.state = data;
      OS.shell.showDesktop();
      OS.markDirty();
      OS.toast('Backup restored. Save to keep it in the file.', 'ok', 5000);
    } catch (e) {
      OS.dialogs.alert('The backup could not be restored: ' + e.message, { title: 'Recovery backup' });
    }
  }

  async function boot() {
    OS.shell.mount();
    OS.shell.hideDesktop();
    OS.shell.applyTheme();

    var raw;
    try { raw = OS.storage.readEmbedded(); }
    catch (e) {
      console.error(e);
      fatal('This file is damaged', 'The data inside this file could not be read (' + e.message + '). Nothing has been changed. Open a backup copy of the file, or start over with an empty desktop.',
        h('button', { class: 'btn ghost', type: 'button', onclick: function () { location.reload(); } }, 'Reload'));
      return;
    }

    var data, password = null;
    try {
      if (raw && raw.encrypted) {
        var res = await OS.shell.lockScreen(raw);
        password = res.password;
        data = OS.storage.migrate(res.data);
        data.fileId = raw.fileId || data.fileId;
      } else if (raw) {
        data = OS.storage.migrate(raw);
      } else {
        data = OS.storage.defaultData();
      }
    } catch (e) {
      console.error(e);
      fatal('Cannot open this file', e.message);
      return;
    }

    OS.state = data;
    OS.shell.applyTheme();
    if (!data.setupDone) {
      var pwSet = await OS.shell.setupScreen();
      data.setupDone = true;
      if (pwSet) OS.markDirty();
    }
    OS.shell.showDesktop();
    OS.storage.backup.start();
    await checkBackup(password);
    password = null;
  }

  OS.boot = boot;
  if (!window.__OS_NO_AUTOBOOT__) boot().catch(function (e) { console.error(e); fatal('Startup failed', e.message); });
})();
